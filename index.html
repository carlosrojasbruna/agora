<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ágora · MAT1219 Álgebra Lineal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@400;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
/* =========================================================================
   Ágora · estilos según el Kit Digital UC (kitdigital.uc.cl)
   Paleta, escala tipográfica, radios y sombras tomados del sistema oficial.
   Tipografías: Roboto y Roboto Slab.
   ========================================================================= */
:root{
  /* primaria */
  --celeste:#0176DE; --azul:#173F8A; --azul-osc:#03122E;
  --amarillo:#FEC60D; --amarillo-osc:#E3AE00;
  /* secundaria */
  --negro:#000000; --gris-a:#707070; --gris-b:#9C9C9C; --gris-c:#C6C6C6;
  --claro-a:#EAEAEA; --claro-b:#F0F0F0; --claro-c:#F6F6F6; --blanco:#FFFFFF;
  /* feedback */
  --exito:#00AA00; --alerta:#E3AE00; --error:#F24F4F; --info:#0176DE;
  /* roles */
  --bg:var(--claro-c); --card:var(--blanco); --ink:var(--azul-osc); --muted:var(--gris-a);
  --line:var(--claro-a); --brand:var(--azul); --brand2:var(--celeste); --accent:var(--amarillo);
  --ok:var(--exito); --warn:var(--alerta); --bad:var(--error); --ia:var(--azul); --iabg:#EEF3FB;
  --r:4px;
  --sombra:0 2px 8px rgba(136,136,136,.18);
  --sombra-modal:0 4px 20px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Roboto","Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:16px; line-height:24px; letter-spacing:.5px;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5,h6{font-family:"Roboto Slab","Roboto",Georgia,serif;text-wrap:balance;margin:0}
:focus-visible{outline:2px solid var(--celeste);outline-offset:2px;border-radius:2px}

/* ---------------- barra superior institucional ---------------- */
header{
  background:var(--azul-osc); color:var(--blanco);
  display:flex; align-items:center; gap:16px; padding:12px 24px;
  position:sticky; top:0; z-index:30; flex-wrap:wrap;
  border-bottom:3px solid var(--celeste);
}
header .logo{display:flex;align-items:center;gap:14px;min-width:0}
header .logo img{height:30px;width:auto;display:block;flex:none}
header .logo b{
  font-family:"Roboto Slab",Georgia,serif; font-weight:700; font-size:20px;
  letter-spacing:.18px; line-height:1; padding-left:14px; border-left:1px solid rgba(255,255,255,.3);
}
header .logo.sinlogo b{padding-left:0;border-left:0}
header .logo span{font-size:14px;font-weight:400;letter-spacing:1px;opacity:.82;line-height:16px}
header .logo span small{font-size:11px;letter-spacing:.5px}
header .spacer{flex:1}
header .who{
  font-size:14px;font-weight:500;letter-spacing:1px;background:rgba(255,255,255,.12);
  padding:6px 14px;border-radius:var(--r);white-space:nowrap
}
header .hbtn{
  border:1px solid rgba(255,255,255,.45);background:transparent;color:var(--blanco);
  padding:6px 14px;border-radius:var(--r);cursor:pointer;font-size:14px;font-family:inherit;
  font-weight:500;letter-spacing:.5px
}
header .hbtn:hover{background:rgba(255,255,255,.14)}
@media(max-width:680px){
  header{gap:10px;padding:10px 16px}
  header .logo span{display:none}
  header .logo b{font-size:18px;padding-left:10px}
  header .logo img{height:24px}
}

/* ---------------- barra de demostración ---------------- */
.demobar{
  background:var(--claro-a);color:var(--gris-a);font-size:14px;line-height:20px;letter-spacing:.28px;
  padding:8px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--gris-c)
}
.demobar b{color:var(--azul-osc);font-weight:500}
.demobar button{
  border:1px solid var(--gris-c);background:var(--blanco);color:var(--gris-a);
  border-radius:var(--r);padding:4px 11px;font-size:13px;cursor:pointer;font-family:inherit;letter-spacing:.28px
}
.demobar button:hover{border-color:var(--celeste);color:var(--celeste)}
.demobar button.on{background:var(--celeste);border-color:var(--celeste);color:var(--blanco);font-weight:500}

/* ---------------- estructura ---------------- */
main{padding:28px 24px 56px;max-width:800px;margin:0 auto}
main.wide{max-width:1200px}
@media(max-width:680px){main{padding:20px 16px 44px}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:24px;margin-bottom:20px;box-shadow:var(--sombra)
}
@media(max-width:680px){.card{padding:18px}}
.card h1{font-size:40px;line-height:48px;font-weight:700;letter-spacing:0;margin-bottom:8px;color:var(--azul-osc)}
.card h2{font-size:24px;line-height:28px;font-weight:700;letter-spacing:.18px;margin-bottom:8px;color:var(--azul)}
.card h3{font-size:18px;line-height:24px;font-weight:700;letter-spacing:.25px;margin:24px 0 8px;color:var(--azul-osc)}
@media(max-width:680px){.card h1{font-size:32px;line-height:36px}}
.sub{color:var(--muted);font-size:14px;line-height:20px;letter-spacing:.28px;margin-bottom:16px}
p{margin:0 0 16px}
p:last-child{margin-bottom:0}
label{
  display:block;font-size:14px;line-height:16px;font-weight:500;letter-spacing:1px;
  margin:20px 0 6px;color:var(--azul-osc)
}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:11px 13px;border:1px solid var(--gris-c);border-radius:var(--r);
  font-size:16px;line-height:24px;font-family:inherit;background:var(--blanco);color:var(--ink);letter-spacing:.5px
}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--celeste);outline:none;box-shadow:0 0 0 3px rgba(1,118,222,.15)}
textarea{min-height:120px;resize:vertical}
.btn{
  display:inline-block;border:1px solid transparent;background:var(--celeste);color:var(--blanco);
  padding:11px 22px;border-radius:var(--r);cursor:pointer;
  font-size:16px;line-height:24px;font-weight:500;letter-spacing:.5px;font-family:inherit
}
.btn:hover{background:#0165bf}
.btn.sec{background:var(--blanco);color:var(--celeste);border-color:var(--celeste)}
.btn.sec:hover{background:var(--claro-c)}
.btn.ok{background:var(--exito)}
.btn.ok:hover{background:#009100}
.btn.sm{padding:5px 13px;font-size:14px;line-height:20px;letter-spacing:.28px}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;background:var(--gris-b);border-color:transparent}
.btn:disabled:hover{background:var(--gris-b)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:20px;letter-spacing:.28px}
.note{font-size:14px;line-height:20px;color:var(--muted);margin-top:10px;letter-spacing:.28px}
.note a{color:var(--celeste);font-weight:500}
.tag{
  display:inline-block;font-size:14px;line-height:16px;font-weight:500;letter-spacing:1px;
  background:var(--claro-b);border-radius:var(--r);padding:4px 10px;color:var(--gris-a);margin-right:6px
}
.pill{
  display:inline-block;padding:3px 11px;border-radius:var(--r);
  font-size:14px;line-height:20px;font-weight:500;letter-spacing:.28px
}
.pill.ok{background:#E6F6E6;color:#007A00}
.pill.bad{background:#FDECEC;color:#C22B2B}
.pill.warn{background:#FDF4DC;color:#8A6A00}
.pill.gray{background:var(--claro-a);color:var(--gris-a)}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}
code.k{background:var(--claro-b);padding:2px 6px;border-radius:var(--r);font-size:14px;font-family:"Roboto Mono",monospace}
details{margin-top:12px}
details summary{cursor:pointer;color:var(--celeste);font-size:16px;font-weight:500;letter-spacing:.5px}
a{color:var(--celeste)}

/* ---------------- progreso ---------------- */
.topbar{
  position:sticky;top:var(--hh,54px);z-index:20;background:var(--bg);
  padding:14px 0 16px;border-bottom:1px solid var(--line);margin-bottom:20px
}
.topbar .line{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:8px;gap:12px;letter-spacing:.28px}
.progress{height:8px;background:var(--claro-a);border-radius:var(--r);overflow:hidden}
.progress i{display:block;height:100%;background:var(--celeste);transition:width .45s ease}
.stars-count{font-weight:700;color:var(--amarillo-osc);white-space:nowrap;letter-spacing:0}

/* ---------------- pregunta ---------------- */
.stem{font-size:18px;line-height:32px;letter-spacing:.5px;margin:14px 0 20px}
.stem .katex-display{margin:.8em 0;overflow-x:auto;overflow-y:hidden;padding-bottom:4px}
.opts{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.opt{
  border:1px solid var(--gris-c);border-radius:var(--r);padding:14px 16px;cursor:pointer;
  display:flex;gap:14px;align-items:flex-start;background:var(--blanco);transition:.15s;
  text-align:left;font-family:inherit;font-size:16px;line-height:24px;letter-spacing:.5px;color:var(--ink);width:100%
}
.opt:hover:not(.locked){border-color:var(--celeste);background:#F5FAFF}
.opt.sel{border-color:var(--celeste);border-width:2px;padding:13px 15px;background:#EAF4FE}
.opt.right{border-color:var(--exito);border-width:2px;padding:13px 15px;background:#F1FAF1}
.opt.wrong{border-color:var(--error);border-width:2px;padding:13px 15px;background:#FEF3F3}
.opt.locked{cursor:default}
.opt .L{font-weight:700;min-width:22px;color:var(--azul)}
.opt.right .L{color:var(--exito)}.opt.wrong .L{color:var(--error)}
.opt .txt{flex:1;overflow-x:auto}
.opt .mark{font-weight:500;font-size:14px;letter-spacing:.28px;white-space:nowrap}

/* ---------------- revelación ---------------- */
.reveal{border-left:4px solid var(--celeste);background:var(--claro-c);padding:20px 22px;border-radius:0 var(--r) var(--r) 0}
.reveal.bad{border-left-color:var(--error);background:#FEF6F6}
.reveal.good{border-left-color:var(--exito);background:#F4FBF4}
.reveal .verdict{font-family:"Roboto Slab",Georgia,serif;font-weight:700;font-size:20px;line-height:24px;letter-spacing:.25px;margin-bottom:12px}
.reveal.good .verdict{color:#007A00}.reveal.bad .verdict{color:#C22B2B}
.reveal .sol{font-size:16px;line-height:24px;letter-spacing:.5px}
.reveal .sol .katex-display{overflow-x:auto;overflow-y:hidden}

/* ---------------- rúbrica ---------------- */
.crit{border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0;background:var(--claro-c)}
.crit .cn{font-weight:700;font-size:16px;line-height:24px;letter-spacing:.25px;margin-bottom:4px}
.crit .ch{font-size:14px;line-height:20px;color:var(--muted);margin-bottom:12px;letter-spacing:.28px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:640px){.levels{grid-template-columns:1fr}}
.lv{
  border:1px solid var(--gris-c);background:var(--blanco);border-radius:var(--r);padding:12px 14px;
  cursor:pointer;font-size:14px;line-height:20px;letter-spacing:.28px;text-align:left;
  font-family:inherit;color:var(--ink);transition:.15s
}
.lv:hover{border-color:var(--celeste);background:#F5FAFF}
.lv.on{border-color:var(--celeste);border-width:2px;padding:11px 13px;background:#EAF4FE;font-weight:500}
.lv .n{display:block;font-size:14px;line-height:16px;color:var(--gris-b);font-weight:500;margin-bottom:4px;letter-spacing:1px}
.lv.on .n{color:var(--celeste)}
.crit.cat .lv.on{border-color:var(--amarillo-osc);background:#FDF7E4}
.crit.cat .lv.on .n{color:var(--amarillo-osc)}

/* ---------------- comentario ---------------- */
.counter{font-size:14px;line-height:20px;color:var(--muted);margin-top:8px;text-align:right;letter-spacing:.28px}
.counter.ok{color:var(--exito);font-weight:500}

/* ---------------- lista del curso ---------------- */
.roster{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
@media(max-width:640px){.roster{grid-template-columns:1fr}}
.rw{
  display:flex;gap:12px;align-items:center;border:1px solid var(--gris-c);background:var(--blanco);
  border-radius:var(--r);padding:11px 14px;cursor:pointer;font-family:inherit;font-size:14px;
  line-height:20px;letter-spacing:.28px;color:var(--ink);text-align:left;width:100%
}
.rw:hover{border-color:var(--celeste);background:#F5FAFF}
.rw.on{border-color:var(--celeste);border-width:2px;padding:10px 13px;background:#EAF4FE}
.rw .rc{font-weight:700;color:var(--azul);letter-spacing:1px;white-space:nowrap;font-size:14px}
.rw .rn{flex:1;line-height:20px}

/* ---------------- chatbot ---------------- */
.chat{border:1px solid var(--line);background:var(--iabg);border-radius:var(--r);overflow:hidden;margin-top:16px}
.chat .hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--blanco)}
.chat .hd .av{
  width:26px;height:26px;border-radius:50%;background:var(--azul);color:var(--blanco);
  display:grid;place-items:center;font-size:11px;flex:none
}
.chat .hd b{font-size:14px;line-height:16px;color:var(--azul);letter-spacing:1px;font-weight:500}
.chat .body{max-height:280px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.chat .msg{max-width:88%;padding:12px 15px;border-radius:var(--r);font-size:16px;line-height:24px;letter-spacing:.5px}
.chat .msg.ia{background:var(--blanco);border:1px solid var(--line);align-self:flex-start}
.chat .msg.yo{background:var(--celeste);color:var(--blanco);align-self:flex-end}
.chat .msg.yo b{color:var(--blanco)}
.chat .msg .acc{margin-top:10px}
.chat .esc{font-size:14px;color:var(--azul);padding:0 16px 10px;letter-spacing:.28px}
.chat .esc::after{content:"";animation:puntos 1.2s steps(4,end) infinite}
@keyframes puntos{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.chat .in{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:var(--blanco)}
.chat .in input{flex:1}
.sug{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.sug button{
  font-size:14px;line-height:20px;border:1px solid var(--gris-c);background:var(--blanco);color:var(--celeste);
  border-radius:var(--r);padding:7px 13px;cursor:pointer;font-family:inherit;text-align:left;letter-spacing:.28px;font-weight:500
}
.sug button:hover{border-color:var(--celeste);background:#F5FAFF}
.chat.doc{margin-top:0}
.chat.doc .body{max-height:440px}
.chat .msg table{font-size:14px;margin-top:8px}
.chat .msg ul{margin:8px 0 0 20px;padding:0}
.chat .msg li{margin:4px 0}

/* ---------------- síntesis y hallazgos ---------------- */
.aibox{border-left:4px solid var(--azul);background:var(--iabg);padding:18px 20px;border-radius:0 var(--r) var(--r) 0;margin-top:18px}
.aibox .t{font-weight:500;color:var(--azul);font-size:14px;line-height:16px;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:8px;text-transform:uppercase}
.aibox ul{margin:10px 0 0 20px;padding:0;font-size:16px;line-height:24px}
.aibox li{margin:6px 0}
.aibox .cita{font-style:italic;color:var(--gris-a);background:var(--blanco);border-radius:var(--r);padding:12px 14px;margin:8px 0;font-size:14px;line-height:20px}
.aibox .acc{font-size:14px;line-height:20px;color:var(--azul);font-weight:500;margin-bottom:6px;letter-spacing:.28px}
.aibox .dis{font-size:14px;line-height:20px;color:var(--muted);margin-top:12px;border-top:1px solid var(--gris-c);padding-top:10px;letter-spacing:.28px}
.find{border:1px solid var(--line);border-left-width:4px;border-radius:0 var(--r) var(--r) 0;padding:18px 20px;margin:12px 0;background:var(--blanco);box-shadow:var(--sombra)}
.find.alta{border-left-color:var(--error)}
.find.media{border-left-color:var(--alerta)}
.find.info{border-left-color:var(--celeste)}
.find .fh{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px;flex-wrap:wrap}
.find .ft{font-family:"Roboto Slab",Georgia,serif;font-weight:700;font-size:18px;line-height:24px;letter-spacing:.25px}
.find .fd{font-size:16px;line-height:24px;letter-spacing:.5px}
.find .fa{font-size:14px;line-height:20px;color:var(--azul);font-weight:500;margin-top:10px;background:var(--iabg);padding:10px 12px;border-radius:var(--r);letter-spacing:.28px}

/* ---------------- estrellas e insignias ---------------- */
.starpop{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,18,46,.4);z-index:60;pointer-events:none;animation:fade .9s ease forwards}
.starpop div{font-size:84px;animation:pop .9s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}45%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes fade{0%{opacity:0}25%{opacity:1}80%{opacity:1}100%{opacity:0}}
.badges{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.badge{border:1px solid var(--line);background:var(--blanco);border-radius:var(--r);padding:14px 12px;font-size:14px;line-height:20px;text-align:center;min-width:104px;opacity:.45}
.badge.got{opacity:1;border-color:var(--amarillo-osc);background:#FDF9EC}
.badge .ic{font-size:28px;display:block;line-height:1.2}
.badge b{display:block;font-size:14px;margin-top:4px;letter-spacing:.28px}

/* ---------------- tablas y datos ---------------- */
table{width:100%;border-collapse:collapse;font-size:14px;line-height:20px;letter-spacing:.28px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--claro-b);font-weight:500;color:var(--azul-osc);position:sticky;top:0;letter-spacing:1px;font-size:14px}
tr:hover td{background:var(--claro-c)}
td b,td .pill{font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bar{display:grid;grid-template-columns:28px 1fr 88px;gap:12px;align-items:center;font-size:14px;margin:7px 0;letter-spacing:.28px}
.bar .track{height:16px;background:var(--claro-a);border-radius:var(--r);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--gris-b)}
.bar.right .track i{background:var(--exito)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:760px){.kpi{grid-template-columns:repeat(2,1fr)}}
.kpi div{background:var(--claro-c);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi b{display:block;font-family:"Roboto Slab",Georgia,serif;font-size:32px;line-height:36px;color:var(--azul);letter-spacing:.23px;font-variant-numeric:tabular-nums}
.kpi span{font-size:14px;line-height:16px;color:var(--muted);letter-spacing:1px}

/* ---------------- pestañas ---------------- */
nav.tabs{display:flex;gap:0;padding:0 24px;background:var(--blanco);border-bottom:1px solid var(--gris-c);flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav.tabs button{
  border:0;border-bottom:3px solid transparent;background:transparent;padding:14px 18px;cursor:pointer;
  font-size:16px;line-height:24px;color:var(--gris-a);white-space:nowrap;font-family:inherit;
  font-weight:500;letter-spacing:.5px
}
nav.tabs button:hover{color:var(--celeste)}
nav.tabs button.active{color:var(--celeste);border-bottom-color:var(--celeste)}

/* ---------------- varios ---------------- */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--azul-osc);color:var(--blanco);
  padding:14px 22px;border-radius:var(--r);font-size:16px;line-height:24px;opacity:0;transition:.3s;
  pointer-events:none;z-index:70;max-width:90vw;text-align:center;box-shadow:var(--sombra-modal);letter-spacing:.5px
}
.toast.show{opacity:1}
.likert{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.likert button{
  border:1px solid var(--gris-c);background:var(--blanco);border-radius:var(--r);padding:12px 0;cursor:pointer;
  font-size:16px;flex:1;min-width:64px;font-family:inherit;color:var(--ink);line-height:20px;font-weight:500

<script type="text/plain" id="banco">
@@ID q1
@@TEMA Métodos de eliminación
@@RA Distinguir y aplicar los métodos de eliminación de Gauss y Gauss-Jordan
@@CLAVE B
@@ENUNCIADO
¿Cuál de las siguientes afirmaciones describe correctamente la diferencia entre el método de Gauss y el método de Gauss--Jordan?
@@A
El método de Gauss solo puede aplicarse a sistemas que tienen el mismo número de ecuaciones que de incógnitas.
@@B
El método de Gauss transforma la matriz en una matriz escalonada, mientras que Gauss--Jordan continúa hasta obtener una matriz escalonada reducida.
@@C
Gauss--Jordan permite intercambiar filas, pero el método de Gauss no.
@@D
El método de Gauss se utiliza para resolver sistemas lineales, mientras que Gauss--Jordan solamente se utiliza para calcular matrices inversas.
@@SOL
Ambos métodos utilizan operaciones elementales por filas. El método de Gauss busca obtener una **matriz escalonada**. En cambio, el método de Gauss--Jordan continúa el proceso hasta obtener una **matriz escalonada reducida**.

Por lo tanto, la alternativa correcta es la **B**.

@@ID q2
@@TEMA Sistemas lineales · consistencia
@@RA Interpretar la forma escalonada para determinar el número de soluciones
@@CLAVE C
@@ENUNCIADO
Al aplicar eliminación gaussiana a un sistema de tres ecuaciones con tres incógnitas se obtiene la siguiente **matriz aumentada escalonada**:
$$\left(\begin{array}{ccc|c} 1 & 2 & -1 & 3\\ 0 & 1 & 4 & 2\\ 0 & 0 & 0 & 0\end{array}\right)$$
¿Qué se puede concluir sobre el sistema?
@@A
Es inconsistente porque aparece una fila de ceros.
@@B
Tiene solución única porque tiene tres ecuaciones y tres incógnitas.
@@C
Tiene infinitas soluciones y una variable libre.
@@D
Tiene infinitas soluciones y dos variables libres.
@@SOL
Hay pivotes en las columnas correspondientes a $x$ e $y$, pero no en la columna correspondiente a $z$. Por lo tanto, $z$ es una **variable libre**.

La última fila representa $0=0$, por lo que no existe una contradicción y el sistema es **consistente**. Como existe una variable libre, el sistema tiene infinitas soluciones.

Alternativa **C**.

@@ID q3
@@TEMA Álgebra matricial · producto
@@RA Calcular el producto de matrices y reconocer cuándo está definido
@@CLAVE A
@@ENUNCIADO
Sean
$$A=\begin{pmatrix} 1 & -1 & 2\\ 0 & 2 & 1\end{pmatrix},\qquad B=\begin{pmatrix} 1 & 0\\ 2 & -1\\ 1 & 3\end{pmatrix}.$$
¿Cuál es el producto $AB$?
@@A
$\begin{pmatrix} 1 & 7\\ 5 & 1\end{pmatrix}$
@@B
$\begin{pmatrix} 1 & 5\\ 7 & 1\end{pmatrix}$
@@C
$\begin{pmatrix} 1 & -7\\ 5 & -1\end{pmatrix}$
@@D
$\begin{pmatrix} 3 & 4\\ 3 & 2\end{pmatrix}$
@@SOL
El producto está definido porque $A$ es de tamaño $2\times3$ y $B$ es de tamaño $3\times2$. Calculamos cada entrada mediante producto fila por columna:
$$AB=\begin{pmatrix} 1(1)+(-1)(2)+2(1) & 1(0)+(-1)(-1)+2(3)\\[2mm] 0(1)+2(2)+1(1) & 0(0)+2(-1)+1(3)\end{pmatrix}=\begin{pmatrix} 1&7\\ 5&1\end{pmatrix}.$$
Alternativa **A**.

@@ID q4
@@TEMA Sistemas homogéneos · pivotes
@@RA Relacionar el número de pivotes con la existencia y unicidad de soluciones
@@CLAVE B
@@ENUNCIADO
Sea $A$ una matriz de tamaño $3\times4$. Al escalonar $A$ se obtiene una matriz que tiene un pivote en cada una de sus tres filas. ¿Cuál de las siguientes afirmaciones es correcta?
@@A
El sistema homogéneo $A\vec{x}=\vec{0}$ tiene únicamente la solución trivial porque hay un pivote en cada fila.
@@B
El sistema homogéneo $A\vec{x}=\vec{0}$ tiene infinitas soluciones y, para cualquier $\vec{b}\in\mathbb{R}^3$, el sistema $A\vec{x}=\vec{b}$ también tiene infinitas soluciones.
@@C
El sistema homogéneo tiene infinitas soluciones, pero $A\vec{x}=\vec{b}$ es inconsistente para todo $\vec{b}\neq\vec{0}$.
@@D
El número de soluciones del sistema homogéneo no puede determinarse sin conocer las entradas de $A$.
@@SOL
La matriz tiene $4$ columnas, una por cada variable, pero solamente $3$ pivotes. Por lo tanto, necesariamente existe una **variable libre** y el sistema homogéneo $A\vec{x}=\vec{0}$ tiene infinitas soluciones.

Además, hay un pivote en cada una de las tres filas. Por lo tanto, al escalonar la matriz aumentada $(A\,|\,\vec{b})$ no puede aparecer una fila de la forma $(0\;0\;0\;0\,|\,c)$ con $c\neq0$. Entonces, para cualquier $\vec{b}\in\mathbb{R}^3$ el sistema es **consistente**, y como sigue existiendo una variable libre, tendrá infinitas soluciones.

Alternativa **B**.

@@ID q5
@@TEMA Determinantes
@@RA Calcular determinantes de orden 3 por expansión de cofactores
@@CLAVE B
@@ENUNCIADO
Considere la matriz
$$A=\begin{pmatrix} 2 & 1 & 0\\ -1 & 3 & 2\\ 0 & 4 & 1\end{pmatrix}.$$
¿Cuál es el valor de $\det(A)$?
@@A
$-11$
@@B
$-9$
@@C
$9$
@@D
$11$
@@SOL
Desarrollamos el determinante por la primera fila:
$$\det(A)=2\begin{vmatrix} 3&2\\ 4&1\end{vmatrix}-\begin{vmatrix} -1&2\\ 0&1\end{vmatrix}=2(3\cdot1-2\cdot4)-\big((-1)\cdot1-2\cdot0\big).$$
Por lo tanto, $\det(A)=2(3-8)-(-1)=-10+1=-9$.

Alternativa **B**.

@@ID q6
@@TEMA Matriz inversa
@@RA Conectar la reducción a la identidad con la invertibilidad
@@CLAVE C
@@ENUNCIADO
Sea $A$ una matriz cuadrada de orden $3$. Al aplicar Gauss--Jordan a $A$ se obtiene $A\;\longrightarrow\;I_3$. ¿Cuál de las siguientes afirmaciones es necesariamente verdadera?
@@A
Solamente el sistema homogéneo $A\vec{x}=\vec{0}$ tiene solución única; para otros vectores $\vec{b}$ el sistema puede ser inconsistente.
@@B
$A$ tiene inversa, pero eso no garantiza que $A\vec{x}=\vec{b}$ tenga solución para cualquier $\vec{b}$.
@@C
Para todo $\vec{b}\in\mathbb{R}^3$, el sistema $A\vec{x}=\vec{b}$ tiene una única solución, dada por $\vec{x}=A^{-1}\vec{b}$.
@@D
Como $A$ puede transformarse en $I_3$ mediante operaciones elementales por filas, necesariamente $A=I_3$.
@@SOL
Si mediante operaciones elementales por filas podemos transformar $A$ en $I_3$, entonces $A$ es **invertible**. Por lo tanto, para cualquier $\vec{b}\in\mathbb{R}^3$ podemos multiplicar $A\vec{x}=\vec{b}$ por $A^{-1}$:
$$A^{-1}A\vec{x}=A^{-1}\vec{b}\quad\Longrightarrow\quad \vec{x}=A^{-1}\vec{b}.$$
Así, para cada $\vec{b}$ existe exactamente una solución.

Alternativa **C**.

@@ID q7
@@TEMA Dependencia lineal e invertibilidad
@@RA Reconocer dependencia entre filas y sus consecuencias sobre la inversa
@@CLAVE C
@@ENUNCIADO
Considere la matriz
$$A=\begin{pmatrix} 1 & 2 & 1\\ 0 & 1 & 3\\ 2 & 5 & 5\end{pmatrix}.$$
Observe que $F_3=2F_1+F_2$. ¿Cuál de las siguientes afirmaciones es correcta?
@@A
Como $A$ es cuadrada, necesariamente tiene inversa.
@@B
Las filas de $A$ son linealmente dependientes, pero $A$ admite inversa porque el sistema homogéneo $A\vec{x}=\vec{0}$ siempre tiene al menos una solución.
@@C
Las filas de $A$ son linealmente dependientes y, al aplicar Gauss--Jordan a $(A\,|\,I)$, no es posible transformar el bloque izquierdo en la matriz identidad.
@@D
Aunque una fila de $A$ sea combinación lineal de las otras, las operaciones elementales por filas permiten convertir $A$ en la matriz identidad.
@@SOL
La relación $F_3=2F_1+F_2$ muestra que la tercera fila depende de las dos primeras. Mediante la operación $F_3\longrightarrow F_3-2F_1-F_2$ se obtiene una fila completamente nula.

Por lo tanto, al continuar el proceso de Gauss--Jordan no puede aparecer un pivote en cada fila y no es posible transformar $A$ en $I$. En consecuencia, tampoco es posible transformar $(A\,|\,I)$ en $(I\,|\,A^{-1})$: la matriz $A$ **no es invertible**.

La alternativa B contiene un error conceptual importante: todo sistema homogéneo tiene la solución trivial, pero eso no significa que su matriz de coeficientes sea invertible.

Alternativa **C**.

@@ID q8
@@TEMA Sistemas con parámetro
@@RA Discutir el número de soluciones de un sistema según un parámetro
@@CLAVE C
@@ENUNCIADO
Considere, dependiendo del parámetro $\lambda\in\mathbb{R}$, el sistema
$$\begin{pmatrix} 1 & 1 & 0\\ 2 & \lambda & 1\\ 0 & 1 & 1\end{pmatrix}\begin{pmatrix} x\\ y\\ z\end{pmatrix}=\begin{pmatrix} 1\\ 0\\ 1\end{pmatrix}.$$
¿Cuál de las siguientes afirmaciones describe correctamente el número de soluciones del sistema?
@@A
Para todo $\lambda\in\mathbb{R}$, el sistema tiene solución única.
@@B
Si $\lambda\neq3$, el sistema tiene solución única; si $\lambda=3$, tiene infinitas soluciones.
@@C
Si $\lambda\neq3$, el sistema tiene solución única; si $\lambda=3$, el sistema no tiene solución.
@@D
Si $\lambda=3$, el sistema tiene solución única; si $\lambda\neq3$, el sistema no tiene solución.
@@SOL
Escribimos la matriz aumentada y aplicamos $F_2\to F_2-2F_1$, luego intercambiamos $F_2$ y $F_3$, y finalmente $F_3\to F_3-(\lambda-2)F_2$:
$$\left(\begin{array}{ccc|c} 1&1&0&1\\ 0&1&1&1\\ 0&0&3-\lambda&-\lambda\end{array}\right).$$
Si $\lambda\neq3$, la tercera fila contiene un pivote, hay un pivote para cada una de las tres variables y el sistema tiene **solución única**.

En cambio, si $\lambda=3$, la última fila se convierte en $(0\;0\;0\,|\,-3)$, que representa la ecuación imposible $0=-3$. Por lo tanto, para $\lambda=3$ el sistema es **inconsistente**.

Alternativa **C**.
</script>

/* Texto con negritas, saltos de párrafo y LaTeX protegido */
function md(t){
  const mem=[];
  let s=String(t==null?"":t);
  s=s.replace(/\$\$[\s\S]*?\$\$|\$[^$\n]*?\$/g, m=>{mem.push(m);return "\u0001M"+(mem.length-1)+"M\u0001"});
  s=esc(s).replace(/--/g,"–").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  s=s.split(/\n{2,}/).map(p=>"<p>"+p.replace(/\n/g,"<br>")+"</p>").join("");
  return s.replace(/\u0001M(\d+)M\u0001/g,(m,i)=>mem[+i]);
}
function tex(el){

}

/* --------------------- parser del banco de preguntas --------------------- */
function parseBanco(txt){
  const out=[]; let cur=null, campo=null;
  txt.split(/\r?\n/).forEach(ln=>{
    const m=ln.match(/^@@([A-ZÁ]+)\s*(.*)$/);
    if(m){
      const k=m[1], v=m[2].trim();
      if(k==="ID"){ if(cur) out.push(cur); cur={id:v,tema:"",ra:"",clave:"A",stem:"",alts:["","","",""],sol:""}; campo=null; return; }
      if(!cur) return;
      if(k==="TEMA"){cur.tema=v;campo=null;return}
      if(k==="RA"){cur.ra=v;campo=null;return}
      if(k==="CLAVE"){cur.clave=v.toUpperCase();campo=null;return}
      if(k==="ENUNCIADO"){campo="stem";return}
      if(k==="SOL"){campo="sol";return}
      if(["A","B","C","D"].indexOf(k)>=0){campo="alt"+k;return}
      return;
    }
    if(!cur||!campo) return;
    if(campo==="stem") cur.stem += (cur.stem?"\n":"")+ln;
    else if(campo==="sol") cur.sol += (cur.sol?"\n":"")+ln;
    else { const i=L.indexOf(campo.slice(3)); cur.alts[i]+=(cur.alts[i]?"\n":"")+ln; }
  });
  if(cur) out.push(cur);
  return out.map(q=>({...q, stem:q.stem.trim(), sol:q.sol.trim(), alts:q.alts.map(a=>a.trim())}));
}

const RX_CAUSA = /porque|ya que|debido a|puesto que|dado que|por eso|por lo que|me hizo|me llev[oó]|asum[ií]|cre[ií] que|pens[eé] que/i;
const RX_ENUN  = /enunciado|redacci[oó]n|se entiende|ambigu|est[aá] claro|frase|palabra|se lee|releer|le[ií] dos veces/i;
const RX_SOL   = /soluci[oó]n|explicaci[oó]n|aclar|desarrollo|paso a paso|me qued[oó] claro/i;
const RX_CONCR = /matriz|pivote|fila|columna|determinante|signo|variable libre|inversa|escalonad|producto|par[aá]metro|lambda|homog[eé]neo|consistente/i;
const RX_VAGO  = /^(?:.{0,200})$/;

function diagCom(txt){
  const t=(txt||"").trim(), n=t.length;
  const alts=[]; let m; RX_ALT.lastIndex=0;
  while((m=RX_ALT.exec(t))) alts.push(m[1]||m[2]);
  const d={
    n:n,
    alts:[...new Set(alts.map(a=>a.toUpperCase()))],
    causa:RX_CAUSA.test(t),
    enunciado:RX_ENUN.test(t),
    solucion:RX_SOL.test(t),
    concreto:RX_CONCR.test(t),
    frases:t.split(/[.!?]+/).filter(s=>s.trim().length>10).length
  };
  // el orden importa: se devuelve una sola carencia, la más útil de señalar
  if(n<40)                          d.dx="temprano";
  else if(!d.alts.length&&!d.concreto) d.dx="sin_anclaje";
  else if(d.alts.length&&!d.causa)  d.dx="alt_sin_causa";
  else if(!d.alts.length&&d.concreto&&!d.causa) d.dx="sin_causa";
  else if(!d.enunciado&&!d.solucion) d.dx="sin_mejora";
  else                               d.dx="ok";
  return d;
}
const COACH_MSG={
  temprano:     d=>"Cuéntame qué te pasó con esta pregunta. A medida que escribas te voy diciendo qué le falta para que le sirva a quien la diseñó.",
  sin_anclaje:  d=>"Por ahora tu comentario cuenta cómo te fue, pero no dice <b>qué</b> de la pregunta lo provocó. Nombrar una alternativa concreta — la B, la C — es lo que le sirve a quien la diseñó.",
  alt_sin_causa:d=>"Mencionas la <b>"+d.alts[0]+"</b>. ¿Qué te hizo pensar que podía ser la correcta? Ese es justamente el dato que no se ve en las estadísticas.",
  sin_causa:    d=>"Describes lo que pasó, pero no por qué. Una frase que empiece con “porque…” convierte tu comentario en algo que se puede corregir.",
  sin_mejora:   d=>"Ya explicaste tu razonamiento. ¿Hay algo del <b>enunciado</b> o de la <b>solución comentada</b> que cambiarías? Con eso quien diseñó la pregunta sabe dónde meter mano.",
  ok:           d=>"Tu comentario nombra algo concreto y explica por qué. Así es exactamente como sirve — puedes enviarlo."
};
const COACH_LABEL={sin_anclaje:"sin anclaje concreto",alt_sin_causa:"alternativa sin explicación",
  sin_causa:"sin causa explícita",sin_mejora:"sin propuesta de mejora",ok:"comentario completo",temprano:"muy breve aún"};

/* --- 2. agrupación temática de comentarios --- */
const TEMAS=[
  {id:"movil",   n:"problemas para ver la pregunta en el celular", rx:/celular|pantalla|se corta|se sale|desplaz|m[oó]vil|tel[eé]fono|zoom/i,
   accion:"Revisar el desplazamiento horizontal de las matrices antes del próximo uso."},
  {id:"descart", n:"alternativas incorrectas fáciles de descartar", rx:/descart|obvi|sin calcular|se ve al tiro|con mirar|salta a la vista|nadie (?:la )?elegir/i,
   accion:"Reemplazar el distractor que nadie considera por uno que represente un error real."},
  {id:"tentador",n:"alternativas incorrectas que sí funcionaron", rx:/tentador|casi la eleg|dud[eé]|me convenc|plausible|suenan? (?:razonable|posible)|estuve a punto/i,
   accion:"Conservar esos distractores: están haciendo su trabajo."},

  {id:"solmas",  n:"piden más en la solución comentada", rx:/podr[ií]a (?:mostrar|incluir|agregar)|sugiero|faltó|deber[ií]a (?:mostrar|decir|incluir)|me habr[ií]a servido|agregar/i,

   accion:"Ninguna: la explicación está cumpliendo su función."},
  {id:"facil",   n:"la encontraron demasiado directa", rx:/r[aá]pido|f[aá]cil|directa|muy practicad|sin pensar|autom[aá]tic/i,

  {id:"error",   n:"les reveló un error propio", rx:/me equivoqu[eé]|comet[ií]a|asum[ií]|no revis[eé]|me confund[ií]|pens[eé] que|error que/i,
   accion:"Llevar esta pregunta a clase: el error que expone está instalado en el curso."}
];
function temasDe(coms){
  const res=TEMAS.map(t=>({...t,hits:coms.filter(c=>t.rx.test(c.txt||c))}))
                 .filter(t=>t.hits.length>0)
                 .sort((a,b)=>b.hits.length-a.hits.length);
  return res;
}
function sintesisHTML(coms,total){
  if(!coms.length) return '<div class="muted small">Sin comentarios que resumir todavía.</div>';
  const ts=temasDe(coms).slice(0,4);
  if(!ts.length) return '<div class="muted small">Los comentarios no caen en ningún patrón reconocible. Conviene leerlos uno a uno.</div>';
  const cita=c=>{const x=c.hits.slice().sort((a,b)=>(b.txt||b).length-(a.txt||a).length)[0]; return (x.txt||x);};
  return `<div class="aibox">
    <div class="t">Síntesis automática · ${coms.length} de ${total} estudiantes comentaron</div>
    <ul>${ts.map(t=>`<li><b>${t.hits.length} de ${coms.length}</b> mencionan ${esc(t.n)}.
      <details><summary>ver ejemplo y acción sugerida</summary>
        <div class="cita">“${esc(cita(t).slice(0,240))}${cita(t).length>240?"…":""}”</div>
        <div class="acc">→ ${esc(t.accion)}</div></details></li>`).join("")}</ul>
    <div class="dis">Agrupación automática. Sirve para priorizar la lectura, no para reemplazarla.</div>
  </div>`;
}

/* --- 3. triangulación entre conducta y valoración --- */
function moda(arr){ // arr = [n1,n2,n3]
  const mx=Math.max(...arr); if(mx===0) return null;
  return arr.indexOf(mx)+1;
}
function medianaN(a){ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; }

function hallazgos(){
  const out=[], N=sesiones().length;
  DB.preguntas.forEach((q,i)=>{
    const st=statsQ(q); if(!st.tot) return;
    const acierto=pct(st.ok,st.tot);
    const dif=st.rub.dificultad||[0,0,0], cla=st.rub.claridad||[0,0,0];
    const dis=st.rub.distractores||[0,0,0], sol=st.rub.solucion||[0,0,0];
    const pDis=+prom(dis)||0, pCla=+prom(cla)||0, pSol=+prom(sol)||0;
    const mDif=moda(dif);
    const incorrectas=L.filter(l=>l!==q.clave);
    const elegidas=incorrectas.map(l=>({l,n:st.dist[l]||0}));
    const muertos=elegidas.filter(e=>e.n===0);
    const maxDis=Math.max(...elegidas.map(e=>e.n));
    const P="Pregunta "+(i+1);

    if(acierto>=70 && mDif===3)
      out.push({s:"media",q:i+1,t:"Dificultad percibida que no coincide con el desempeño",
        d:`${P}: acertó el <b>${acierto}%</b>, pero la mayoría marcó la dificultad como “muy difícil”. La sensación de dificultad viene del cálculo o de la extensión, no del concepto.`,
        a:"Revisar si lo que cansa es la aritmética y no la idea que se quiere evaluar."});
    if(acierto<=40 && mDif===1)
      out.push({s:"alta",q:i+1,t:"La encontraron fácil y fallaron igual",
        d:`${P}: solo acertó el <b>${acierto}%</b>, pero la valoraron como “muy fácil”. Ese desajuste suele indicar una trampa involuntaria o una lectura equivocada del enunciado.`,
        a:"Leer los comentarios de quienes fallaron antes de reutilizar el ítem."});
    if(pDis>=2.4 && maxDis<=Math.max(1,Math.round(st.tot*0.1)))
      out.push({s:"alta",q:i+1,t:"Valoración de cortesía en los distractores",
        d:`${P}: valoraron los distractores en <b>${pDis.toFixed(2)}</b> de 3 (“parecían posibles”), pero ninguna alternativa incorrecta superó ${maxDis} elección(es). Lo que dicen y lo que hicieron no coincide.`,
        a:"Tomar con reserva este criterio de la rúbrica: con el grupo pequeño puede estar operando la cortesía."});
    if(muertos.length && st.tot>=5)
      out.push({s:"media",q:i+1,t:"Distractor sin ninguna elección",
        d:`${P}: nadie eligió ${muertos.map(e=>"<b>"+e.l+"</b>").join(" ni ")} en ${st.tot} respuestas. Un distractor que no atrae a nadie no aporta información.`,
        a:"Reemplazarlo por un error que los estudiantes cometan de verdad."});
    const top=elegidas.slice().sort((a,b)=>b.n-a.n)[0];
    if(top && top.n>(st.dist[q.clave]||0) && st.tot>=5)
      out.push({s:"alta",q:i+1,t:"Un distractor gana a la clave",
        d:`${P}: la alternativa <b>${top.l}</b> recibió ${top.n} elecciones y la clave <b>${q.clave}</b> solo ${st.dist[q.clave]||0}. O hay un concepto mal instalado en el curso, o hay un problema con la clave.`,
        a:"Verificar la clave y, si está bien, llevar el ítem a clase como caso de discusión."});
    if(pCla && pCla<2.0)
      out.push({s:"alta",q:i+1,t:"Claridad por debajo del umbral",
        d:`${P}: la claridad promedia <b>${pCla.toFixed(2)}</b> de 3. El costo se paga en tiempo de lectura y en comentarios sobre la redacción, no sobre el contenido.`,
        a:"Reescribir el enunciado antes de volver a usarlo."});
    if(pSol && pSol<2.0 && acierto<50)
      out.push({s:"alta",q:i+1,t:"Prioridad de reescritura: se falla y la solución no rescata",
        d:`${P}: acierto de <b>${acierto}%</b> y utilidad de la solución en <b>${pSol.toFixed(2)}</b> de 3. Es el peor cruce posible: el ítem detecta un vacío y después no lo cierra.`,
        a:"Ampliar la solución comentada con el paso que se está saltando."});
  });

  /* fatiga a lo largo del recorrido */
  const porPos=DB.preguntas.map(q=>{
    const cs=sesiones().map(s=>(s.ciclos||{})[q.id]).filter(c=>c&&c.completo);
    return {n:cs.length, chars:cs.length?Math.round(cs.reduce((a,c)=>a+c.chars,0)/cs.length):0};
  });
  const conDatos=porPos.filter(p=>p.n>=3);
  if(conDatos.length>=4){
    const pri=conDatos.slice(0,2), ult=conDatos.slice(-2);
    const a=Math.round(pri.reduce((x,p)=>x+p.chars,0)/pri.length);
    const b=Math.round(ult.reduce((x,p)=>x+p.chars,0)/ult.length);
    if(a>0 && b<a*0.85)
      out.push({s:"media",q:"—",t:"Los comentarios se acortan hacia el final",
        d:`Las dos primeras preguntas promedian <b>${a}</b> caracteres y las dos últimas <b>${b}</b>: una caída del <b>${Math.round(100-100*b/a)}%</b>. Es fatiga del recorrido, no una propiedad de esas preguntas.`,
        a:"Rotar el orden de las preguntas entre estudiantes, o acortar el conjunto."});
  }
  /* el comentario es opcional: cuántos lo omiten es el dato que importa */
  const todos=[]; let omitidos=0;
  sesiones().forEach(s=>Object.values(s.ciclos||{}).forEach(c=>{ if(c.completo){ todos.push(c.chars); if(!c.chars) omitidos++; } }));
  if(todos.length>=8 && omitidos/todos.length>=0.25)
    out.push({s:"alta",q:"—",t:"Una parte del curso está saltándose el comentario",
      d:`<b>${omitidos} de ${todos.length}</b> ciclos (${pct(omitidos,todos.length)}%) se cerraron sin comentario. Como escribir no es obligatorio, esto mide interés real, no cumplimiento: es el dato más honesto del piloto.`,
      a:"Ver si se concentran al final del recorrido (fatiga) o en preguntas concretas (nada que decir sobre ese ítem)."});
  if(todos.length>=8 && omitidos===0)
    out.push({s:"info",q:"—",t:"Nadie se saltó el comentario",
      d:`Los <b>${todos.length}</b> ciclos completados traen comentario, y escribirlo era opcional. La consigna y el asistente están funcionando.`,
      a:"Ninguna."});
  const orden={alta:0,media:1,info:2};
  return out.sort((x,y)=>orden[x.s]-orden[y.s]);
}

/* =========================================================================
   CHATBOT SIMULADO
   Las respuestas se construyen con los datos reales de la sesión: qué
   alternativa eligió, si acertó, cómo valoró la pregunta, cuánto lleva
   escrito. Por eso suenan razonables sin que haya ningún modelo detrás.
   ========================================================================= */

function rot(arr,n){ return arr[(n||0)%arr.length]; }
const LETRA={A:"A",B:"B",C:"C",D:"D"};

/* ---- lo que el asistente sabe del estudiante en este momento ---- */
function ctxEst(qid){
  const c=C(qid), q=DB.preguntas.find(x=>x.id===qid);
  const d=diagCom(c.com||"");
  return {c,q,d, rub:c.rub||{}, turno:(c.chat||[]).filter(m=>m.de==="yo").length};
}
function saludoEst(qid){
  const {c,q}=ctxEst(qid);
  const otras=L.filter(l=>l!==q.clave&&l!==c.resp);
  if(c.correcto)
    return `Acertaste con la <b>${q.clave}</b>. Lo que más nos sirve no es eso, sino lo que dudaste antes de decidir: ¿alguna de las otras te hizo pensar?`;
  return `Elegiste la <b>${c.resp}</b> y la clave era la <b>${q.clave}</b>. Eso es justamente lo interesante: ¿qué te hizo pensar que la ${c.resp} era la correcta?`;
}

/* ---- motor de respuesta del asistente del estudiante ---- */
function responderEst(qid,txt){
  const x=ctxEst(qid), t=(txt||"").trim(), n=x.turno;
  const bajo=t.toLowerCase();
  const alts=[]; RX_ALT.lastIndex=0; let m;
  while((m=RX_ALT.exec(t))) alts.push((m[1]||m[2]).toUpperCase());
  const suyas=[...new Set(alts)];

  // 1. cierre de la conversación: el mensaje entero tiene que ser esa palabra,
  //    o "no sé qué escribir" se confundiría con un "no"
  if(/^(listo|ya|ya est[aá]|termin[eé]|termine|gracias|ok|okay|vale|dale|perfecto|genial|s[ií]|no)[\s.!¡]*$/i.test(bajo))
    return {t: x.faltan>0
      ? `Bien. Te faltan <b>${x.faltan}</b> caracteres para poder enviar. Si quieres, escribe ahí mismo lo que me acabas de decir.`
      : `Perfecto. Tu comentario ya se puede enviar cuando quieras.`};

  // 2. límite honesto: no resuelve el ejercicio
  if(/c[oó]mo se (resuelve|hace|calcula)|por qu[eé] (es|da|sale)|expl[ií]came (el|la|c[oó]mo|por)|no entiendo (la materia|el ejercicio|c[oó]mo)|resu[eé]lve/i.test(bajo))
    return {t:`Eso no te lo puedo resolver yo, y tampoco es mi papel: la explicación está en la solución comentada, más arriba. Lo mío es que tu comentario le sirva a quien diseñó la pregunta. ¿Qué parte de esa solución te dejó con dudas?`};

  // 2b. no entiende la tarea o el vocabulario
  if(/qu[eé] es un distractor|qu[eé] son los distractores|qu[eé] significa|no entiendo (el criterio|la r[uú]brica|qu[eé] me piden|para qu[eé])|para qu[eé] sirve esto|qu[eé] hago aqu[ií]/i.test(bajo))
    return {t:`Los <b>distractores</b> son las tres alternativas incorrectas. Un buen distractor representa un error que alguien cometería de verdad; uno malo se descarta de una mirada. Lo que te pedimos es contarle a quien diseñó la pregunta cómo funcionó contigo: qué te hizo dudar y qué cambiarías. No es una nota, y no hay respuesta correcta.`};

  // 3. dudas sobre el largo
  if(/cu[aá]nto|cu[aá]ntos|caracteres|m[ií]nimo|largo|corto|suficiente|falta|obligatorio|tengo que comentar/i.test(bajo))
    return {t: (x.c.chars||0)===0
      ? `No hay largo mínimo ni es obligatorio: puedes seguir sin comentar. Dicho eso, una sola frase que diga <b>qué alternativa te tentó y por qué</b> vale más que cinco de relleno — y es lo que da la estrella.`
      : `No hay mínimo ni es obligatorio. Llevas <b>${x.c.chars}</b> caracteres y con eso basta si se entiende sin haber visto la pregunta; escribir más no lo mejora por sí solo.`};

  // 4. no sabe qué escribir: se le ofrece un ángulo sacado de su propia valoración
  if(/no s[eé]|ni idea|no se me ocurre|qu[eé] escribo|qu[eé] pongo|ayuda|ay[uú]dame|no sabr[ií]a|c[oó]mo empiez|c[oó]mo empez|por d[oó]nde|c[oó]mo parto|partir|qu[eé] se supone|qu[eé] digo|qu[eé] tengo que (decir|escribir|poner)|en blanco|nada que decir/i.test(bajo)){
    const op=[];
    if(x.rub.claridad===1) op.push(`marcaste que el enunciado era confuso, así que cuéntame qué parte tuviste que releer`);
    if(x.rub.claridad===2) op.push(`dijiste que se entendía con esfuerzo: ¿dónde estuvo el esfuerzo?`);
    if(x.rub.distractores>=2) op.push(`dijiste que alguna alternativa incorrecta era tentadora, dime cuál y qué la hacía creíble`);
    if(x.rub.distractores===1) op.push(`dijiste que las incorrectas se descartaban solas, así que cuenta cuál sobraba`);
    if(x.rub.solucion<=2) op.push(`la solución no te aclaró del todo: ¿qué paso faltaba?`);
    if(!x.c.correcto) op.push(`te equivocaste con la ${x.c.resp}: contar por qué te pareció correcta es lo más útil que puedes dejar`);
    if(!op.length) op.push(`dime qué fue lo último que dudaste antes de marcar tu respuesta`);
    const dudo = x.c.correcto ? L.filter(l=>l!==x.q.clave)[0] : x.c.resp;
    const arranque = `Dudé entre la ${dudo} y la ${x.q.clave} porque `;
    return {t:`Tienes más material del que crees: ${rot(op,n)}.<br><br>Y si lo que te cuesta es la primera frase, empieza por la más simple: qué alternativa te hizo dudar. Te dejo el comienzo y tú lo terminas.`,
            pasar:arranque, etiqueta:"Empezar con esta frase"};
  }

  // 5. nombró una alternativa
  if(suyas.length){
    const a=suyas[0];
    if(RX_CAUSA.test(t))
      return {t:`Eso es exactamente lo que le sirve a quien diseñó la pregunta: no que la ${a} estuviera mal, sino por qué parecía bien.`,
              pasar:t};
    return {t:`Anotado, la <b>${a}</b>. Ahora lo importante: ¿qué te hizo considerarla? ¿El enunciado, algo que recordabas de clase, cómo estaba redactada?`};
  }

  // 6. juicios sobre la dificultad
  if(/f[aá]cil|obvia|simple|r[aá]pid|directa/i.test(bajo))
    return {t:`Si te resultó fácil, lo útil es decir <b>por qué</b>: ¿se podía acertar sin hacer el cálculo? ¿Alguna alternativa se descartaba de una mirada? Eso le dice a la docente que hay que subir la exigencia.`};
  if(/dif[ií]cil|complicad|enredad|cost[oó]|no pude|imposible|larg[ao]/i.test(bajo))
    return {t:`¿Y difícil por dónde: por el concepto, por el cálculo o por cómo estaba escrita? No es lo mismo, y la diferencia es justo lo que hay que corregir.`};

  // 7. mensaje sustantivo: se le ofrece llevarlo al comentario
  if(t.length>=60 && (RX_CAUSA.test(t)||RX_CONCR.test(t)))
    return {t:`Eso ya es un comentario útil: dice algo concreto y explica por qué. ¿Lo paso al campo de comentario para que lo puedas afinar?`, pasar:t};

  // 8. mencionó algo concreto del contenido: se le devuelve esa misma palabra
  if(RX_CONCR.test(t)){
    const pal=(t.match(RX_CONCR)||[""])[0];
    return {t:`Te quedaste en “<b>${esc(pal)}</b>”. Eso es lo concreto que hay que dejar por escrito. ¿Te pasó por cómo estaba planteada la pregunta, o fue un error tuyo de cálculo? Las dos cosas sirven, pero se corrigen distinto.`};
  }

  // 9. respuesta general, siempre anclada en algo suyo
  const gen=[
    x.c.correcto
      ? `Acertaste, así que cuéntame lo otro: ¿alguna alternativa incorrecta estuvo cerca de convencerte?`
      : `Volvamos a tu respuesta: elegiste la ${x.c.resp}. ¿Qué tenía esa alternativa que te pareció correcto?`,
    `¿Y del enunciado? ¿Hay alguna palabra o algún dato que hubieras escrito de otra forma?`,
    `Piensa en quien va a leer esto para arreglar la pregunta: ¿qué le dirías que cambie primero?`,
    x.d.dx==="ok" ? `Tu comentario ya está bastante completo. ¿Le agregarías algo sobre la solución comentada?`
                  : `Con lo que llevas escrito todavía no se entiende qué pasó exactamente. Dame un detalle concreto.`
  ];
  return {t:rot(gen,n)};
}

/* ---- avisos que el asistente lanza solo, sin que el estudiante escriba ---- */
function empujeEst(qid){
  const c=C(qid);
  if(c._avisoMin) return null;
  if((c.chars||0)>=90){ c._avisoMin=1; return `Con eso ya tienes un comentario. Léelo una vez: ¿se entiende sin haber visto la pregunta? Si sí, envíalo — no hace falta que sea más largo.`; }
  return null;
}

  $("#mb-est").className = rol==="est"?"on":"";
  $("#mb-doc").className = rol==="doc"?"on":"";
  const bc=$("#mb-coach");
  if(bc){
    const m=DB.config.coach;

    bc.textContent = m==="on" ? "Asistente: activado" : (m==="off" ? "Asistente: apagado" : "Asistente: repartido A/B");
  }
  if(rol==="doc"){
    m.className="wide";
    $("#hright").innerHTML='<span class="who">Panel docente</span>';
    m.innerHTML = tabsDoc() + vistaDoc();
  }else{
    m.className="";
    $("#hright").innerHTML = cod
      ? '<span class="who">'+esc(cod)+'</span> <button class="hbtn" onclick="salir()">Salir</button>'
      : '<span class="who">Sin sesión</span>';

  }
  tex(m);
  // subir al inicio solo cuando cambia la pantalla; valorar o escribir no mueve la página
  const clave=[rol,vista,tab,cod,S()?S().idx:""].join("|");
  if(clave!==_pantalla){ _pantalla=clave; window.scrollTo({top:0}); }
}
function setRol(r){ rol=r; tab="diagnostico"; verDoc=null; render(); }

/* ============================ ESTUDIANTE ============================ */

/* ---------- 1. ingreso por código ---------- */

function filtrarCurso(q){

function elegirCodigo(c){

function entrar(){

  cod=v;
  if(!DB.sesiones[cod]){
    DB.sesiones[cod]={codigo:cod,creada:ahora(),ultima:ahora(),aperturas:1,idx:0,ciclos:{},insignias:[],encuesta:null,terminado:false,
      grupo: DB.config.coach==="on" ? "coach" : (DB.config.coach==="off" ? "control" : grupoDe(cod))};

  guardar();

  if(S().terminado) vista="fin";

}
function salir(){ if(cod) ev("sesion_cerrada"); cod=null; vista="login"; render(); }

/* ---------- 2. bienvenida ---------- */
function pantallaBienvenida(){

  <div class="card">

function empezar(){ vista="ciclo"; render(); }

function barraProgreso(){
  const s=S(), n=completos(s), e=estrellas(s);
  return `<div class="line" style="display:flex;justify-content:space-between;font-size:13px;margin:14px 0 7px">

      <span class="stars-count">${e?"⭐".repeat(Math.min(e,NQ())):"sin estrellas aún"}</span></div>
    <div class="progress"><i style="width:${pct(n,NQ())}%"></i></div>`;

/* ---------- 3. el ciclo de una pregunta ---------- */
function proximaPregunta(){
  const s=S();
  for(let i=0;i<NQ();i++){ const q=DB.preguntas[i]; if(!s.ciclos[q.id]||!s.ciclos[q.id].completo) return i; }
  return -1;
}
function pantallaCiclo(){
  const s=S(), i=proximaPregunta();
  if(i<0){ vista = s.encuesta ? "fin" : "encuesta"; return vistaEst(); }
  s.idx=i;
  const q=DB.preguntas[i], c=C(q.id), n=completos(s);
  if(!c._abierta){ c._abierta=1; ev("pregunta_abierta",q.id,c.paso); }
  guardar();

  let html = `
  <div class="topbar">
    <div class="line">
      <span><b>Pregunta ${i+1}</b> de ${NQ()}</span>
      <span class="stars-count">${estrellas(s)} ⭐</span>
    </div>
    <div class="progress"><i style="width:${pct(n,NQ())}%"></i></div>
  </div>

  <div class="card">
    <div><span class="tag">${esc(q.tema)}</span></div>
    <div class="stem">${md(q.stem)}</div>
    <div class="opts">${q.alts.map((a,k)=>optHTML(q,c,a,k)).join("")}</div>`;

  if(c.paso==="responder"){
    html += `<button class="btn block" id="btn-conf" ${c.resp==null?"disabled":""} onclick="confirmar('${q.id}')">Confirmar respuesta</button>
      <div class="note">Una vez que confirmes no podrás cambiarla.</div>`;
  }
  html += `</div>`;

  if(c.paso!=="responder") html += bloqueRevelacion(q,c);
  if(c.paso==="valorar"||c.paso==="comentar") html += bloqueRubrica(q,c);
  // el asistente aparece en cuanto la respuesta queda confirmada: así se le puede
  // preguntar cómo empezar antes de haber escrito una sola palabra
  if(c.paso==="valorar" && coachActivo())
    html += `<div class="card"><h2>¿Dudas sobre qué decir?</h2>
      <div class="sub">Puedes conversar con el asistente ahora o más adelante, mientras escribes tu comentario.</div>
      ${coachHTML(c)}</div>`;
  if(c.paso==="comentar") html += bloqueComentario(q,c);

  return html;
}
function optHTML(q,c,a,k){
  const letra=L[k], resp=c.resp, cl=q.clave;
  let cls="opt", mark="";
  if(c.paso==="responder"){
    if(resp===letra) cls+=" sel";
    return `<button class="${cls}" onclick="elegir('${q.id}','${letra}')"><span class="L">${letra}</span><span class="txt">${md(a)}</span></button>`;
  }
  cls+=" locked";
  if(letra===cl){ cls+=" right"; mark='<span class="mark" style="color:var(--ok)">✔ correcta</span>'; }
  else if(letra===resp){ cls+=" wrong"; mark='<span class="mark" style="color:var(--bad)">tu respuesta</span>'; }
  if(letra===cl && letra===resp) mark='<span class="mark" style="color:var(--ok)">✔ tu respuesta</span>';
  return `<div class="${cls}"><span class="L">${letra}</span><span class="txt">${md(a)}</span>${mark}</div>`;
}
function elegir(qid,letra){
  const c=C(qid); if(c.paso!=="responder") return;
  c.resp=letra; guardar();
  document.querySelectorAll(".opts .opt").forEach(el=>{
    el.classList.toggle("sel", el.querySelector(".L").textContent===letra);
  });
  const b=$("#btn-conf"); if(b) b.disabled=false;
}
function confirmar(qid){
  const c=C(qid), q=DB.preguntas.find(x=>x.id===qid);
  if(!c.resp) return;
  c.tResp=ahora(); c.correcto=(c.resp===q.clave); c.paso="valorar";
  ev("respuesta_enviada",qid,"responder", c.resp+(c.correcto?" (correcta)":" (incorrecta)"));
  guardar(); render();
  setTimeout(()=>{ const el=$(".reveal"); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"center"}); },60);
}
function bloqueRevelacion(q,c){
  return `<div class="card" style="padding:0;overflow:hidden">
    <div class="reveal ${c.correcto?"good":"bad"}" style="border-radius:0">
      <div class="verdict">${c.correcto?"✔ Correcta":"✘ Incorrecta"} · la clave era <b>${q.clave}</b></div>
      <div class="sol">${md(q.sol)}</div>
    </div></div>`;
}

/* ---------- 4. rúbrica ---------- */
function bloqueRubrica(q,c){
  const lista=CRIT().map(cr=>{
    const val=c.rub[cr.id];
    return `<div class="crit ${cr.tipo==="categoria"?"cat":""}" data-crit="${cr.id}">
      <div class="cn">${esc(cr.nombre)} ${cr.tipo==="categoria"?'<span class="pill gray" style="font-weight:600">categoría, no puntaje</span>':""}</div>
      <div class="ch">${esc(cr.ayuda||"")}</div>
      <div class="levels">${cr.niveles.map((nv,k)=>
        `<button class="lv ${val===k+1?"on":""}" onclick="valorar('${q.id}','${cr.id}',${k+1})">
           <span class="n">${cr.tipo==="categoria"?"OPCIÓN "+(k+1):"NIVEL "+(k+1)}</span>${esc(nv)}</button>`).join("")}</div>
    </div>`;
  }).join("");
  const listo=CRIT().every(cr=>c.rub[cr.id]);
  return `<div class="card">
    <h2>Valora esta pregunta</h2>
    <div class="sub">Ahora que viste la solución, di cómo funcionó la pregunta. Los cuatro criterios son obligatorios.</div>
    ${lista}
    ${c.paso==="valorar"?`<button class="btn block" id="btn-rub" style="margin-top:6px" ${listo?"":"disabled"} onclick="enviarRubrica('${q.id}')">Continuar al comentario</button>
      <div class="note" id="rub-aviso" ${listo?"hidden":""}>Falta marcar un nivel en cada criterio.</div>`:""}
  </div>`;
}
function valorar(qid,crid,n){
  const c=C(qid); if(c.paso!=="valorar"&&c.paso!=="comentar") return;
  c.rub[crid]=n; guardar();
  // actualización quirúrgica: no se vuelve a dibujar la pantalla, así no salta el scroll
  const caja=document.querySelector('[data-crit="'+crid+'"]');
  if(caja) caja.querySelectorAll(".lv").forEach((b,k)=>b.classList.toggle("on",k+1===n));
  const listo=CRIT().every(cr=>c.rub[cr.id]);
  const btn=$("#btn-rub"); if(btn) btn.disabled=!listo;
  const av=$("#rub-aviso"); if(av) av.hidden=listo;
  if(!caja) render();
}
function enviarRubrica(qid){
  const c=C(qid);
  if(!CRIT().every(cr=>c.rub[cr.id])) return;
  c.tRub=ahora(); c.paso="comentar";
  if(c._pendiente){ c.com=(c.com||"")+c._pendiente; c.chars=c.com.trim().length; c._pendiente=null; }
  ev("rubrica_enviada",qid,"valorar", CRIT().map(cr=>cr.id+"="+c.rub[cr.id]).join(" "));
  guardar(); render();
  setTimeout(()=>{ const el=$("#coment"); if(el){ if(el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"center"}); el.focus(); } },60);
}

/* ---------- 5. comentario ---------- */
function bloqueComentario(q,c){
  const n=(c.com||"").trim().length;
  return `<div class="card">
    <h2>Escribe tu comentario</h2>
    <div class="sub">${esc(DB.config.consigna)}</div>
    <textarea id="coment" placeholder="Por ejemplo: dudé entre B y C porque…" oninput="escribir('${q.id}',this.value)">${esc(c.com||"")}</textarea>
    <div class="counter" id="cnt">${n} caracteres${n>=SUSTANTIVO?" · comentario extenso":""}</div>
    ${coachHTML(c)}
    <button class="btn block ok" style="margin-top:8px" id="btn-fin" onclick="completarCiclo('${q.id}')">${n?"Completar y ganar mi estrella ⭐":"Continuar sin comentar"}</button>
    <div class="note">Escribe lo que quieras, del largo que quieras. Puedes seguir sin comentar, aunque entonces no ganas la estrella de esta pregunta. Solo la docente lee tu comentario: tus compañeros no lo ven.</div>
  </div>`;
}
function escribir(qid,v){
  const c=C(qid); c.com=v; c.chars=v.trim().length;
  const n=c.chars, el=$("#cnt"), b=$("#btn-fin");
  if(el){ el.textContent=n+" caracteres"+(n>=SUSTANTIVO?" · comentario extenso":""); el.className="counter"+(n>=SUSTANTIVO?" ok":""); }
  if(b) b.textContent = n?"Completar y ganar mi estrella ⭐":"Continuar sin comentar";
  if(c.coach && c.coach.charsAviso!=null && n>c.coach.charsAviso+15) c.coach.edito=true;
  if(coachActivo()){
    clearTimeout(window._ce);
    window._ce=setTimeout(()=>{
      const e=empujeEst(qid);
      if(e){ c.chat=c.chat||[]; c.chat.push({de:"ia",t:e,ts:ahora()}); guardar(); pintarChat("chat-est",c.chat); }
    },900);
  }
  clearTimeout(window._sv); window._sv=setTimeout(guardar,400);
}

/* ---- 1. chat de la bienvenida: orienta antes de empezar ---- */
function saludoBien(){
  return `Hola. Antes de partir, en una línea: vas a responder <b>${NQ()} preguntas</b> de Álgebra Lineal y, después de cada una, contar qué te pareció. No es una prueba y no lleva nota. ¿Te explico algo más o empezamos?`;
}
function responderBien(txt){
  const b=(txt||"").trim().toLowerCase();
  if(/nota|calific|eval[uú]a|puntaje|me van a evaluar|cuenta para/i.test(b))
    return `No. Nada de lo que hagas aquí lleva nota. Ni acertar, ni valorar alto, ni escribir mucho. Las estrellas son solo por completar los tres pasos de cada pregunta.`;
  if(/an[oó]nim|nombre|saben qui[eé]n|privad|ve mi|leen|qui[eé]n ve/i.test(b))
    return `Te lo digo tal cual: tu código, ${esc(cod)}, aparece junto a tu nombre en la lista de la pantalla de inicio, así que no es anónimo. Lo que sí ocurre es que <b>tus comentarios los lee solo la docente</b>: tus compañeros no los ven, y en las pantallas de resultados las respuestas se muestran por código.`;
  if(/cu[aá]nto (dura|tarda|demora|me toma)|tiempo|r[aá]pido|largo es/i.test(b))
    return `Unos 20 minutos para las ${NQ()} preguntas. Puedes cerrar el navegador cuando quieras y volver: retomas exactamente donde quedaste.`;
  if(/salir|cerrar|volver|despu[eé]s|pausa|guarda/i.test(b))
    return `Sí, puedes salir en cualquier momento. Todo queda guardado en este dispositivo y al volver con tu código sigues donde ibas.`;
  if(/qu[eé] hago|qu[eé] tengo que|c[oó]mo funciona|explic|pasos|en qu[eé] consiste|no entiendo|se trata|de qu[eé] va|qu[eé] es esto|para qu[eé] es|qu[eé] hay que hacer/i.test(b))
    return `Tres pasos por pregunta:<ul><li><b>Respondes</b> y ves de inmediato si acertaste, con la solución explicada.</li><li><b>Valoras</b> la pregunta en cuatro criterios: si se entendía, qué tan difícil era, si las alternativas incorrectas eran creíbles y si la explicación te sirvió.</li><li><b>Comentas</b> para quien la diseñó. No hay largo mínimo y puedes saltarlo, pero la estrella es por completar los tres.</li></ul>`;
  if(/comentario|escribir|qu[eé] escribo|redact/i.test(b))
    return `El comentario es para quien diseñó la pregunta: qué te hizo dudar, si alguna alternativa incorrecta te pareció tentadora y por qué, o qué del enunciado mejorarías. Cuando llegues ahí voy a estar acompañándote.`;
  if(/celular|tel[eé]fono|computador|dispositivo/i.test(b))
    return `Funciona en el celular, que es como la mayoría lo va a usar. Si alguna matriz se sale de la pantalla, se puede desplazar hacia el lado — y si te molesta, dilo en el comentario: eso es justo lo que queremos saber.`;
  if(/matem[aá]tic|materia|contenido|[aá]lgebra|estudiar|preparar/i.test(b))
    return `Es materia del curso: sistemas de ecuaciones, matrices, determinantes e inversas. No hace falta que prepares nada; si te equivocas verás la solución explicada, que es parte de la idea.`;
  if(/empez|empiez|empec|empiec|comenz|comenc|listo|vamos|dale|comenzar|partamos|ok|s[ií]\b/i.test(b))
    return `Perfecto. Pulsa <b>Comenzar</b> cuando quieras.`;
  return `Puedo contarte <b>en qué consiste</b>, <b>cuánto dura</b>, <b>si lleva nota</b>, <b>quién ve tus respuestas</b> o <b>si puedes salir y volver</b>. ¿Qué te sirve?`;
}
function enviarBien(_,txt){
  const t=(txt||"").trim(); if(!t) return;
  const s=S(); s.chatBien=s.chatBien||[];
  s.chatBien.push({de:"yo",t:t,ts:ahora()});
  pintarChat("chat-bien",s.chatBien);
  ev("chat_bienvenida","","bienvenida","turno "+s.chatBien.filter(m=>m.de==="yo").length);
  guardar(); escribiendo("chat-bien",true);
  setTimeout(()=>{ escribiendo("chat-bien",false);
    s.chatBien.push({de:"ia",t:responderBien(t),ts:ahora()});
    guardar(); pintarChat("chat-bien",s.chatBien); }, 420+Math.min(700,t.length*6));
}

/* ---- 2. encuesta de salida conversacional ---- */
function preguntaEnc(i){
  const p=ENCUESTA[i]; if(!p) return null;
  return p.tipo==="likert"
    ? `${esc(p.t)} <span class="muted small">(1 = ${esc(p.ext[0])}, 5 = ${esc(p.ext[1])})</span>`
    : esc(p.t);
}
function sugEnc(i){
  const p=ENCUESTA[i]; if(!p) return [];
  return p.tipo==="likert" ? ["1","2","3","4","5"] : ["Nada en particular"];
}
function enviarEnc(_,txt){
  const t=(txt||"").trim(); if(!t) return;
  const s=S(); s.chatEnc=s.chatEnc||[]; s.encResp=s.encResp||{};
  const i=s.encPaso||0, p=ENCUESTA[i];
  s.chatEnc.push({de:"yo",t:t,ts:ahora()});
  pintarChat("chat-enc",s.chatEnc);
  let resp=null, error=null;
  if(!p){ resp=`Ya está todo respondido. Pulsa <b>Enviar y terminar</b> cuando quieras.`; }
  else if(p.tipo==="likert"){
    const m=t.match(/[1-5]/);
    if(!m) error=`Necesito un número del 1 al 5 para esta. ${preguntaEnc(i)}`;
    else { s.encResp[p.id]=+m[0]; }
  } else {
    s.encResp[p.id] = /^(nada|no|ninguno|ninguna|nada en particular|-)$/i.test(t) ? "" : t;
  }
  if(!error && p){
    s.encPaso=i+1;
    const sig=ENCUESTA[s.encPaso];
    resp = sig ? `${rot(["Anotado.","Gracias.","Listo."],i)} ${preguntaEnc(s.encPaso)}`
               : `Eso es todo. Gracias por probar Ágora — pulsa <b>Enviar y terminar</b> para cerrar.`;
  }
  guardar(); escribiendo("chat-enc",true);
  setTimeout(()=>{ escribiendo("chat-enc",false);
    s.chatEnc.push({de:"ia",t:error||resp,ts:ahora()});
    guardar(); render(); }, 380+Math.min(500,t.length*5));
}

/* ---- interfaz de chat compartida ---- */
function atr(x){ return esc(JSON.stringify(x===undefined?"":x)); }
function chatHTML(o){
  return `<div class="chat" id="${o.id}">
    <div class="hd"><span class="av">◆</span><b>${esc(o.titulo)}</b>
      <span class="spacer" style="flex:1"></span><span class="pill gray">asistente</span></div>
    <div class="body" id="${o.id}-body">${o.msgs.map(m=>msgHTML(m,o.id)).join("")}</div>

/* --- agregados --- */
function sesiones(){ return Object.values(DB.sesiones); }
function statsQ(q){
  const dist={A:0,B:0,C:0,D:0}; let tot=0, ok=0;
  const rub={}, coms=[]; CRIT().forEach(c=>rub[c.id]=[0,0,0]);
  sesiones().forEach(s=>{
    const c=(s.ciclos||{})[q.id]; if(!c) return;
    if(c.resp){ dist[c.resp]=(dist[c.resp]||0)+1; tot++; if(c.resp===q.clave) ok++; }
    CRIT().forEach(cr=>{ const v=c.rub&&c.rub[cr.id]; if(v) rub[cr.id][v-1]++; });
    if(c.completo&&c.com) coms.push({cod:s.codigo,txt:c.com,chars:c.chars,ts:c.tCom});
  });
  return {dist,tot,ok,rub,coms};
}
function prom(arr){ const n=arr.reduce((a,b)=>a+b,0); if(!n) return null; return ((arr[0]*1+arr[1]*2+arr[2]*3)/n).toFixed(2); }

/* ---- chat del panel docente: responde con los datos ya calculados ---- */
let chatDoc=[];
function saludoDoc(){
  const hs=hallazgos(), n=sesiones().length, altas=hs.filter(h=>h.s==="alta").length;
  if(!n) return `Todavía no hay datos del curso. Cuando los estudiantes empiecen a responder podré decirte qué está pasando con cada pregunta. Para verlo funcionando ahora, usa “Simular el curso completo” en la barra de arriba.`;
  return `Tengo los datos de <b>${n}</b> estudiante(s) sobre ${DB.preguntas.length} preguntas. Hay <b>${hs.length}</b> hallazgos, ${altas} de atención alta. Pregúntame por una pregunta concreta, por lo que dicen los comentarios, o por dónde empezar.`;
}
function responderDoc(txt){
  const t=(txt||"").trim(), b=t.toLowerCase();
  const hs=hallazgos(), N=sesiones().length;
  if(!N) return `Sin datos todavía. Usa “Simular el curso completo” en la barra de arriba y vuelve a preguntarme.`;

  // ¿por dónde empezar?
  if(/primero|prioridad|empez|empiez|empec|empiec|urgente|m[aá]s grave|qu[eé] reviso|qu[eé] hago|por d[oó]nde/i.test(b)){
    const top=hs.filter(h=>h.s==="alta").slice(0,3);
    if(!top.length) return `No hay nada de atención alta. Los ${hs.length} hallazgos son de segundo orden: puedes revisarlos con calma en la lista de abajo.`;
    return `Yo empezaría por esto, en este orden:<ul>${top.map(h=>
      `<li><b>${esc(h.t)}</b>${h.q!=="—"?" (pregunta "+h.q+")":""} — ${esc(h.a)}</li>`).join("")}</ul>`;
  }
  // una pregunta concreta
  const mq=b.match(/pregunta\s*(\d+)|\bp\s*(\d+)\b|\bn[uú]mero\s*(\d+)/);
  if(mq){
    const i=parseInt(mq[1]||mq[2]||mq[3],10)-1, q=DB.preguntas[i];
    if(!q) return `Solo hay ${DB.preguntas.length} preguntas cargadas. Dime un número entre 1 y ${DB.preguntas.length}.`;
    const st=statsQ(q), ac=pct(st.ok,st.tot);
    const peor=L.filter(l=>l!==q.clave).map(l=>({l,n:st.dist[l]||0})).sort((a,c)=>c.n-a.n)[0];
    const ts=temasDe(st.coms).slice(0,2);
    const hq=hs.filter(h=>h.q===i+1);
    return `<b>Pregunta ${i+1}</b> (${esc(q.tema)}, clave ${q.clave}).<ul>
      <li>Acertó el <b>${ac}%</b> de ${st.tot} respuestas.</li>
      <li>El distractor más elegido fue la <b>${peor.l}</b>, con ${peor.n}.</li>
      <li>${st.coms.length} comentario(s)${ts.length?": lo que más se repite es "+ts.map(x=>esc(x.n)).join(" y ")+"":"."}</li>
      ${hq.length?`<li>Hallazgos: ${hq.map(h=>esc(h.t)).join("; ")}.</li>`:`<li>Sin hallazgos automáticos.</li>`}
    </ul>`;
  }
  // temas de los comentarios
  if(/comentario|dicen|opinan|escrib|qu[eé] dijeron|feedback/i.test(b)){
    const todos=[]; sesiones().forEach(s=>Object.values(s.ciclos||{}).forEach(c=>{ if(c.com) todos.push({txt:c.com}); }));
    const ts=temasDe(todos).slice(0,4);
    if(!ts.length) return `Hay ${todos.length} comentarios pero no caen en ningún patrón que yo reconozca. Toca leerlos.`;
    return `De los <b>${todos.length}</b> comentarios, esto es lo que más se repite:<ul>${ts.map(x=>
      `<li><b>${x.hits.length}</b> mencionan ${esc(x.n)} — ${esc(x.accion)}</li>`).join("")}</ul>`;
  }
  // un tema específico
  const tema=TEMAS.find(x=>x.rx.test(b)||b.includes(x.id));
  if(tema){
    const todos=[]; sesiones().forEach(s=>DB.preguntas.forEach((q,i)=>{
      const c=(s.ciclos||{})[q.id]; if(c&&c.com&&tema.rx.test(c.com)) todos.push({q:i+1,cod:s.codigo,txt:c.com}); }));
    if(!todos.length) return `Nadie ha mencionado eso en los comentarios.`;
    const porQ={}; todos.forEach(x=>porQ[x.q]=(porQ[x.q]||0)+1);
    return `<b>${todos.length}</b> comentario(s) mencionan ${esc(tema.n)}, sobre todo en la pregunta ${Object.entries(porQ).sort((a,c)=>c[1]-a[1])[0][0]}.
      Un ejemplo: <i>“${esc(todos[0].txt.slice(0,180))}…”</i><br>Sugerencia: ${esc(tema.accion)}`;
  }
  // el asistente de escritura
  if(/asistente|chatbot|bot|a\/b|ab\b|sirvi[oó]|escritura/i.test(b)){
    const d=datosCoach();
    if(!d.coach.n) return `Todavía nadie ha usado el asistente, así que no hay nada que comparar.`;
    const dif=d.mControl?Math.round(100*(d.mCoach-d.mControl)/d.mControl):0;
    return d.mControl
      ? `Con asistente: <b>${d.mCoach}</b> caracteres de media en ${d.coach.n} comentarios. Sin él: <b>${d.mControl}</b> en ${d.control.n}. Diferencia de <b>${dif>=0?"+":""}${dif}%</b>. Se mostraron ${d.coach.avisos} intervenciones y ${d.coach.edito} veces el estudiante siguió escribiendo después. Ojo: el largo no es calidad, la comprobación real es leer una muestra de cada grupo a ciegas.`
      : `Todos los estudiantes tuvieron asistente (${d.coach.n} comentarios, ${d.mCoach} caracteres de media), así que no hay grupo de control con qué compararlos. Para eso hay que ponerlo en modo repartido en Rúbrica y ajustes.`;
  }
  // participación
  if(/particip|abandon|cu[aá]ntos|entraron|complet|terminaron|qui[eé]n/i.test(b)){
    const ss=sesiones(), term=ss.filter(s=>completos(s)>=NQ()).length;
    const medias=ss.filter(s=>completos(s)>0&&completos(s)<NQ()).length;
    const porPaso={responder:0,valorar:0,comentar:0};
    ss.forEach(s=>Object.values(s.ciclos||{}).forEach(c=>{ if(!c.completo&&c.paso!=="listo") porPaso[c.paso]=(porPaso[c.paso]||0)+1; }));
    const peor=Object.entries(porPaso).sort((a,c)=>c[1]-a[1])[0];
    return `Entraron <b>${ss.length}</b> de ${CURSO.length}. Completaron todo <b>${term}</b> y quedaron a medias <b>${medias}</b>.
      Los ciclos incompletos se detienen sobre todo en el paso <b>“${peor[0]}”</b> (${peor[1]} casos).`;
  }
  // rúbrica
  if(/r[uú]brica|criterio|dificultad|claridad|distractor|valoraci[oó]n/i.test(b)){
    const cr=CRIT().filter(c=>c.tipo!=="categoria");
    const prom2=cr.map(c=>{
      const acum=[0,0,0];
      DB.preguntas.forEach(q=>{ const r=statsQ(q).rub[c.id]||[0,0,0]; r.forEach((v,k)=>acum[k]+=v); });
      return {n:c.nombre, p:prom(acum)};
    }).filter(x=>x.p);
    if(!prom2.length) return `Todavía no hay valoraciones suficientes.`;
    const bajo=prom2.slice().sort((a,c)=>a.p-c.p)[0];
    return `Promedios del curso, sobre 3:<ul>${prom2.map(x=>`<li>${esc(x.n)}: <b>${x.p}</b></li>`).join("")}</ul>
      El más bajo es <b>${esc(bajo.n)}</b>, con ${bajo.p}. “Dificultad” no aparece porque es una categoría, no un puntaje.`;
  }
  // exportar
  if(/export|csv|descarg|archivo|datos crudos|saco|sacar|obtener|bajar|llevarme|analizar/i.test(b))
    return `En la pestaña Exportar tienes ocho archivos. Para el análisis del piloto los importantes son <b>Ciclos y tiempos</b> (dónde se atasca el flujo) y <b>Bitácora de eventos</b> (el recorrido completo con marcas de tiempo).`;
  // saludo
  if(t.length<20 && /^(hola|buenas|hey|qu[eé] tal)/i.test(b))
    return saludoDoc();
  // no sé
  return `Eso no sé responderlo. Puedo con: <b>por dónde empezar</b>, <b>una pregunta concreta</b> (“¿qué pasa con la pregunta 7?”), <b>lo que dicen los comentarios</b>, <b>la participación y los abandonos</b>, <b>los promedios de la rúbrica</b> y <b>si sirvió el asistente</b>.`;
}
function enviarDoc(_,txt){
  const t=(txt||"").trim(); if(!t) return;
  chatDoc.push({de:"yo",t:t,ts:ahora()});
  pintarChat("chat-doc",chatDoc);
  escribiendo("chat-doc",true);
  setTimeout(()=>{
    escribiendo("chat-doc",false);
    chatDoc.push({de:"ia",t:responderDoc(t),ts:ahora()});
    pintarChat("chat-doc",chatDoc);
  }, 450+Math.min(800,t.length*7));
}

    ${chatHTML({id:"chat-doc", titulo:"Asistente de análisis", msgs:chatDoc, fn:"enviarDoc", arg:"",
