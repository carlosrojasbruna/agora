  </div>`;
}

/* --- pestaña Diagnóstico: triangulación conducta / valoración --- */
function docDiagnostico(){
  const hs=hallazgos(), N=sesiones().length;
  const altas=hs.filter(h=>h.s==="alta").length, medias=hs.filter(h=>h.s==="media").length;
  const cabeza=chatDocHTML()+`<div class="card">
    <h2>Diagnóstico automático del conjunto</h2>
    <div class="sub">Cruza lo que los estudiantes <b>hicieron</b> (qué alternativa eligieron, cuánto tardaron) con lo que <b>dijeron</b> (la rúbrica y los comentarios). Los desajustes entre ambos son lo que no se ve leyendo ninguna de las dos cosas por separado.</div>
    <div class="kpi">
      <div><b>${N}</b><span>estudiantes con datos</span></div>
      <div><b>${DB.preguntas.length}</b><span>preguntas analizadas</span></div>
      <div><b style="color:var(--bad)">${altas}</b><span>hallazgos de atención alta</span></div>
      <div><b style="color:var(--warn)">${medias}</b><span>hallazgos de atención media</span></div>
    </div>
    <div class="aibox" style="margin-top:16px">
      <div class="t">Cómo leer esto</div>
      <div style="font-size:13.5px;line-height:1.6">Cada hallazgo es una regla aplicada sobre los datos, no una opinión: al lado va siempre el número que la dispara. Son hipótesis para revisar, no conclusiones. Con ${N} estudiantes, un hallazgo apoyado en tres o cuatro respuestas es una pista, no un resultado.</div>
      <div class="dis">Análisis automático · no reemplaza la lectura de los comentarios ni el criterio de la docente.</div>
    </div>
  </div>`;
  if(!hs.length) return cabeza+`<div class="card"><h2>Sin hallazgos</h2><div class="muted small">Todavía no hay suficientes datos, o ninguna regla se activó. Usa “Simular 17 estudiantes” en la barra superior para ver esta vista con datos.</div></div>`;
  const nom={alta:"atención alta",media:"atención media",info:"informativo"};
  return cabeza+`<div class="card">
    <h2>Hallazgos <span class="muted small">(${hs.length})</span></h2>
    ${hs.map(h=>`<div class="find ${h.s}">
      <div class="fh"><span class="ft">${esc(h.t)}</span>
        <span><span class="pill ${h.s==="alta"?"bad":(h.s==="media"?"warn":"gray")}">${nom[h.s]}</span>
        ${h.q!=="—"?'<span class="tag" style="margin-left:5px">P'+h.q+'</span>':""}</span></div>
      <div class="fd">${h.d}</div>
      <div class="fa">→ ${esc(h.a)}</div>
    </div>`).join("")}
  </div>
  ${coachResumen()}`;
}

/* --- efecto medido del coach de escritura (el experimento A/B) --- */
function vioAsistente(c){ return !!(c && c.coach && c.coach.visto>0); }
function datosCoach(){
  const g={coach:{n:0,chars:[],avisos:0,edito:0},control:{n:0,chars:[]}};
  let sc=0, sn=0;
  sesiones().forEach(s=>{
    const cs=Object.values(s.ciclos||{});
    if(cs.some(vioAsistente)) sc++; else sn++;
    cs.forEach(c=>{
      if(!c.completo) return;
      const k=vioAsistente(c)?"coach":"control";
      g[k].n++; g[k].chars.push(c.chars);
      if(k==="coach"){ g.coach.avisos+=c.coach.visto||0; if(c.coach.edito) g.coach.edito++; }
    });
  });
  const media=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
  return {...g, mCoach:media(g.coach.chars), mControl:media(g.control.chars), nCoach:sc, nControl:sn};
}
function coachResumen(){
  const d=datosCoach();
  if(!d.coach.n && !d.control.n) return "";
  const dif=d.mControl?Math.round(100*(d.mCoach-d.mControl)/d.mControl):0;
  return `<div class="card">
    <h2>Efecto del asistente de escritura</h2>
    <div class="sub">Los grupos se arman por lo que cada estudiante <b>vio de verdad</b>, no por el grupo previsto. ${
      DB.config.coach==="on" ? "Ahora mismo el asistente está activado para todo el curso: para comparar contra un control hay que ponerlo en modo repartido, en Rúbrica y ajustes."
      : DB.config.coach==="off" ? "Ahora mismo está desactivado para todos."
      : "Ahora mismo está repartido por paridad del código."}</div>
    <div class="scroll"><table>
      <tr><th>Grupo</th><th>Estudiantes</th><th>Comentarios completos</th><th>Largo medio</th></tr>
      <tr><td><b>Con asistente</b></td><td>${d.nCoach}</td><td>${d.coach.n}</td><td><b>${d.mCoach}</b> caracteres</td></tr>
      <tr><td><b>Sin asistente</b></td><td>${d.nControl}</td><td>${d.control.n}</td><td><b>${d.mControl}</b> caracteres</td></tr>
    </table></div>
    <div class="aibox">
      <div class="t">Lectura</div>
      <div style="font-size:13.5px;line-height:1.6">
        ${d.mCoach&&d.mControl
          ? `Los comentarios del grupo con asistente son un <b>${dif>=0?"+":""}${dif}%</b> ${dif>=0?"más largos":"más cortos"} que los del grupo de control.
             Se mostraron <b>${d.coach.avisos}</b> sugerencias y en <b>${d.coach.edito}</b> casos el estudiante siguió escribiendo después de verla.
             ${Math.abs(dif)<10?"La diferencia es pequeña: con este número de estudiantes no permite concluir nada por sí sola.":"Conviene comprobar si el texto añadido aporta contenido o solo relleno: el largo no es calidad."}`
          : "Todavía no hay comentarios completos en ambos grupos para comparar."}
      </div>
      <div class="dis">El largo es un indicador grueso. La comprobación real es leer una muestra de cada grupo a ciegas.</div>
    </div>
  </div>`;
}

/* ---- 3. chat por pregunta en el panel docente ---- */
let chatQ={};
function saludoQ(i){
  const q=DB.preguntas[i], st=statsQ(q);
  if(!st.tot) return `Todavía no hay respuestas para esta pregunta.`;
  const ac=pct(st.ok,st.tot);
  const peor=L.filter(l=>l!==q.clave).map(l=>({l,n:st.dist[l]||0})).sort((a,c)=>c.n-a.n)[0];
  const hq=hallazgos().filter(h=>h.q===i+1);
  return hq.length
    ? `Acertó el <b>${ac}%</b> de ${st.tot}. Lo que me llama la atención aquí: <b>${esc(hq[0].t.toLowerCase())}</b>. Pregúntame por los comentarios, por los distractores o por qué cambiaría.`
    : `Acertó el <b>${ac}%</b> de ${st.tot} y el distractor más elegido fue la <b>${peor.l}</b> con ${peor.n}. Nada me parece alarmante. Pregúntame por los comentarios o por los distractores.`;
}
function responderQ(i,txt){
  const b=(txt||"").trim().toLowerCase();
  const q=DB.preguntas[i], st=statsQ(q);
  if(!st.tot) return `Sin respuestas para esta pregunta todavía.`;
  const ac=pct(st.ok,st.tot);
  const inc=L.filter(l=>l!==q.clave).map(l=>({l,n:st.dist[l]||0})).sort((a,c)=>c.n-a.n);
  const hq=hallazgos().filter(h=>h.q===i+1);
  const P=cr=>{const a=st.rub[cr]||[0,0,0]; return prom(a);};

  if(/cambi|qu[eé] hago|mejorar|mejora|corregir|arreglar|reescrib|recomien|sugerencia|qu[eé] har[ií]a/i.test(b)){
    if(hq.length) return `Por orden:<ul>${hq.map(h=>`<li><b>${esc(h.t)}</b> — ${esc(h.a)}</li>`).join("")}</ul>`;
    const muertos=inc.filter(x=>x.n===0);
    if(muertos.length) return `Nada urgente, pero ${muertos.map(x=>"la <b>"+x.l+"</b>").join(" y ")} no la eligió nadie: ese distractor no está aportando información y se puede reemplazar.`;
    return `No veo nada que corregir: el acierto es del ${ac}%, los tres distractores atraen a alguien y la valoración no muestra desajustes.`;
  }
  if(/comentario|dicen|opinan|escrib|feedback/i.test(b)){
    const ts=temasDe(st.coms).slice(0,3);
    if(!st.coms.length) return `Nadie ha comentado esta pregunta todavía.`;
    if(!ts.length) return `Hay ${st.coms.length} comentarios pero sin patrón reconocible. El más largo es de ${st.coms.slice().sort((a,c)=>c.chars-a.chars)[0].cod}.`;
    const ej=ts[0].hits.slice().sort((a,c)=>(c.txt||"").length-(a.txt||"").length)[0];
    return `De ${st.coms.length} comentarios:<ul>${ts.map(t=>`<li><b>${t.hits.length}</b> mencionan ${esc(t.n)}</li>`).join("")}</ul>
      Uno textual: <i>“${esc((ej.txt||"").slice(0,200))}…”</i>`;
  }
  if(/distractor|alternativa|incorrect|eligieron|marc[oó]|opci[oó]n/i.test(b))
    return `Con clave <b>${q.clave}</b> y ${st.tot} respuestas:<ul>${
      L.map(l=>`<li><b>${l}</b>${l===q.clave?" (clave)":""}: ${st.dist[l]||0} · ${pct(st.dist[l]||0,st.tot)}%</li>`).join("")}</ul>
      ${inc[0].n===0?"Ninguna incorrecta atrajo a nadie.":`La más elegida de las incorrectas es la <b>${inc[0].l}</b>.`}`;
  if(/dif[ií]cil|dificultad|f[aá]cil|cuesta/i.test(b)){
    const dif=st.rub.dificultad||[0,0,0], m=moda(dif);
    const et=["muy fácil","adecuada","muy difícil"][(m||2)-1];
    return `El curso la clasificó mayoritariamente como <b>${et}</b> (${dif.join(" / ")} entre los tres niveles) y acertó el <b>${ac}%</b>.
      ${ac>=70&&m===3?"Percibida como difícil pero resuelta bien: el peso está en el cálculo, no en el concepto.":""}
      ${ac<=40&&m===1?"La vieron fácil y fallaron: suele indicar una lectura equivocada del enunciado.":""}
      Recuerda que la dificultad es una categoría, no un puntaje: no se promedia.`;
  }
  if(/claridad|enunciado|se entend|redacc/i.test(b))
    return `Claridad promedio: <b>${P("claridad")||"—"}</b> de 3. ${P("claridad")&&+P("claridad")<2?"Está por debajo del umbral: conviene reescribir el enunciado.":"Sin problemas de redacción según el curso."}`;
  if(/soluci[oó]n|explicaci[oó]n|comentada/i.test(b))
    return `Utilidad de la solución comentada: <b>${P("solucion")||"—"}</b> de 3.
      ${P("solucion")&&+P("solucion")<2?"Baja. Si además el acierto es de "+ac+"%, es la primera que ampliaría.":"Está cumpliendo su función."}`;
  if(/qui[eé]n|c[oó]digo|estudiante/i.test(b))
    return `Aquí trabajo con códigos, no con nombres; la equivalencia está en Rúbrica y ajustes. En esta pregunta comentaron ${st.coms.length} estudiante(s): ${st.coms.map(c=>c.cod).join(", ")||"ninguno"}.`;
  if(/resumen|c[oó]mo va|qu[eé] tal|general/i.test(b)) return saludoQ(i);
  return `Sobre esta pregunta puedo con: <b>los comentarios</b>, <b>los distractores</b>, <b>la dificultad</b>, <b>la claridad</b>, <b>la solución comentada</b> y <b>qué cambiaría</b>.`;
}
function enviarQ(i,txt){
  const t=(txt||"").trim(); if(!t) return;
  chatQ[i]=chatQ[i]||[];
  chatQ[i].push({de:"yo",t:t,ts:ahora()});
  pintarChat("chat-q"+i,chatQ[i]);
  escribiendo("chat-q"+i,true);
  setTimeout(()=>{ escribiendo("chat-q"+i,false);
    chatQ[i].push({de:"ia",t:responderQ(i,t),ts:ahora()});
    pintarChat("chat-q"+i,chatQ[i]); }, 420+Math.min(700,t.length*6));
}
function chatQHTML(i){
  if(!chatQ[i]||!chatQ[i].length) chatQ[i]=[{de:"ia",t:saludoQ(i),ts:ahora()}];
  return chatHTML({id:"chat-q"+i, titulo:"Asistente · pregunta "+(i+1), msgs:chatQ[i], fn:"enviarQ", arg:i,
    ph:"Pregunta sobre este ítem…",
    sug:["¿Qué cambiarías?","¿Qué dicen los comentarios?","¿Cómo funcionaron los distractores?"]});
}

    ${L.map(l=>`<label>Alternativa ${l}</label><input type="text" id="np-${l}">`).join("")}

    <label>Solución comentada</label><textarea id="np-sol" style="min-height:80px"></textarea>
    <button class="btn" style="margin-top:12px" onclick="agregarPregunta()">Agregar</button>
    <hr>
    <h3>O importar un archivo</h3>
    <div class="sub">CSV con columnas <code class="k">tema, ra, enunciado, A, B, C, D, clave, solucion</code>, o JSON con esos mismos campos.</div>
    <input type="file" id="np-file" accept=".csv,.json,.txt" onchange="importar(this)" style="padding:8px 0;border:0">
    <div class="note">La importación agrega preguntas; no borra las existentes.</div>
  </div></div>`;

function borrarPregunta(id){
  if(!confirm("¿Quitar esta pregunta del conjunto?")) return;
  DB.preguntas=DB.preguntas.filter(q=>q.id!==id); guardar(); render(); toast("Pregunta quitada");
}
function agregarPregunta(){
  const g=id=>($("#"+id)?$("#"+id).value.trim():"");
  const stem=g("np-stem"); if(!stem){ toast("Falta el enunciado"); return; }
  DB.preguntas.push({id:"q"+(ahora()%1000000), tema:g("np-tema")||"Sin tema", ra:g("np-ra"),
    clave:g("np-clave")||"A", stem:stem, alts:L.map(l=>g("np-"+l)), sol:g("np-sol")});
  guardar(); render(); toast("Pregunta agregada");
}
function importar(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{
    const txt=e.target.result; let filas=[];
    try{
      if(/^\s*[\[{]/.test(txt)){ const j=JSON.parse(txt); filas=Array.isArray(j)?j:(j.preguntas||[]); }
      else filas=parseCSV(txt);
      let n=0;
      filas.forEach(o=>{
        const stem=o.enunciado||o.stem; if(!stem) return;
        DB.preguntas.push({id:"q"+(ahora()%1000000)+"_"+(n++), tema:o.tema||"Importada", ra:o.ra||"",
          clave:(o.clave||"A").toUpperCase(), stem:stem, alts:[o.A,o.B,o.C,o.D].map(x=>x||""), sol:o.solucion||o.sol||""});
      });
      guardar(); render(); toast(n+" pregunta(s) importada(s)");
    }catch(err){ toast("No se pudo leer el archivo: "+err.message); }
  };
  r.readAsText(f,"utf-8");
}
function parseCSV(txt){
  const lines=txt.replace(/\r/g,"").split("\n").filter(l=>l.trim());
  const cut=l=>{const o=[];let cur="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];
    if(ch==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++} else q=!q; }
    else if(ch===","&&!q){o.push(cur);cur=""} else cur+=ch;} o.push(cur); return o.map(s=>s.trim())};
  const head=cut(lines[0]).map(h=>h.toLowerCase());
  return lines.slice(1).map(l=>{const c=cut(l),o={};head.forEach((h,i)=>{
    const k={"a":"A","b":"B","c":"C","d":"D"}[h]||h; o[k]=c[i]||""}); return o});
}

function dl(nombre,filas){
  const csv=filas.map(r=>r.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));
  a.download=nombre; document.body.appendChild(a); a.click(); a.remove();
  toast("Descargando "+nombre);
}
function porCiclo(fn){
  const out=[];

  }));
  return out;
}

 "La pregunta estaba clara, aunque me demoré un poco en entender el enunciado al principio. La solución explicaba lo necesario.",
 "Me pareció bien planteada y no tengo mucho más que agregar sobre esta. Las alternativas incorrectas eran razonables en general.",
 "Un poco difícil pero se puede resolver con calma. Las alternativas estaban bien pensadas y la solución ayudaba a entenderlo.",
 "No me hizo mucho ruido y la respondí sin problemas mayores. Quizás el enunciado podría ser un poco más corto de lo que es.",
 "Estuvo buena la pregunta y la explicación también, aunque al principio me costó entender qué era lo que estaban preguntando.",
 "Me equivoqué pero después entendí por qué con la solución. Las opciones incorrectas eran bastante razonables, la verdad sea dicha."
];
const PERFIL=[
 {p:.65,dif:2,cla:3,dis:2,sol:3},
 {p:.55,dif:2,cla:1,dis:2,sol:2},
 {p:.88,dif:1,cla:3,dis:3,sol:3,wrong:"B"},
 {p:.45,dif:3,cla:2,dis:3,sol:2},
 {p:.75,dif:3,cla:3,dis:2,sol:3},
 {p:.60,dif:2,cla:2,dis:2,sol:2},
 {p:.30,dif:3,cla:2,dis:3,sol:2,wrong:"B"},
 {p:.35,dif:3,cla:2,dis:2,sol:1}
];
const DX_DEMO=["sin_anclaje","alt_sin_causa","sin_causa","sin_mejora"];

function sembrarDemo(){
  if(!confirm("Esto genera datos simulados de 17 estudiantes para poder mostrar el panel docente. ¿Continuar?")) return;
  const base=ahora()-1000*60*60*30;
  let seed=7; const rnd=()=>{seed=(seed*1103515245+12345)%2147483648; return seed/2147483648;};
  const nivel=t=>{ const r=rnd(); const v = r<.62?t : (r<.81?t-1:t+1); return Math.min(3,Math.max(1,v)); };
  for(let i=1;i<=CURSO.length;i++){
    const c=codigoDe(i-1);
    if(DB.sesiones[c]) continue;
    const grupo = DB.config.coach==="on" ? "coach" : (DB.config.coach==="off" ? "control" : (i%2===1?"coach":"control"));
    const meta = i<=10 ? NQ() : (i<=14 ? 2+Math.floor(rnd()*4) : Math.floor(rnd()*2));
    const s={codigo:c,creada:base+i*60000,ultima:base+i*60000,aperturas:1+(rnd()<.3?1:0),idx:0,
             ciclos:{},insignias:[],encuesta:null,terminado:false,grupo:grupo};
    let t=s.creada;
    DB.preguntas.forEach((q,k)=>{
      if(k>meta) return;
      const pf=PERFIL[k]||PERFIL[0];
      const cic=cicloNuevo(); cic.ini=t;
      const acierta=rnd()<pf.p;
      const malas=L.filter(x=>x!==q.clave);
      cic.resp = acierta ? q.clave
        : (pf.wrong && rnd()<.75 ? pf.wrong : malas[Math.floor(rnd()*3)]);
      if(cic.resp===q.clave && !acierta) cic.resp=malas[0];
      cic.correcto=(cic.resp===q.clave);
      t += 25000+Math.floor(rnd()*70000); cic.tResp=t;
      if(k<meta){
        cic.rub={claridad:nivel(pf.cla), dificultad:nivel(pf.dif), distractores:nivel(pf.dis), solucion:nivel(pf.sol)};
        t += 12000+Math.floor(rnd()*30000); cic.tRub=t;
        const banco = grupo==="coach" ? (k<3?COMENTARIOS_DEMO:COMENTARIOS_MEDIOS)
                                      : (k<2?COMENTARIOS_MEDIOS:COMENTARIOS_CORTOS);
        const txt=banco[(i*3+k)%banco.length];
        cic.com=txt; cic.chars=txt.trim().length;
        if(grupo==="coach"){
          const avisos=rnd()<.7?1:2, edito=rnd()<.6;
          cic.coach={visto:avisos, dx:Array.from({length:avisos},(_,z)=>DX_DEMO[Math.floor(rnd()*DX_DEMO.length)]),
                     charsAviso: Math.max(40, cic.chars-(edito?40+Math.floor(rnd()*60):5)), edito:edito, ocultado:rnd()<.12};
          DB.eventos.push({ts:t+3000,cod:c,tipo:"coach_sugerencia",q:q.id,paso:"comentar",extra:cic.coach.dx[0]+" · "+cic.coach.charsAviso+" caracteres"});
        }
        t += 40000+Math.floor(rnd()*120000); cic.tCom=t;
        cic.completo=true; cic.paso="listo";
        DB.eventos.push({ts:cic.tResp,cod:c,tipo:"respuesta_enviada",q:q.id,paso:"responder",extra:cic.resp});
        if(grupo==="coach") DB.eventos.push({ts:t-1000,cod:c,tipo:"coach_resultado",q:q.id,paso:"comentar",
          extra:"avisos="+cic.coach.visto+" editó="+(cic.coach.edito?"sí":"no")+" caracteres "+cic.coach.charsAviso+"→"+cic.chars});
        DB.eventos.push({ts:cic.tCom,cod:c,tipo:"ciclo_completo",q:q.id,paso:"listo",extra:"duracion_s="+seg(cic.ini,cic.tCom)});
      }else{
        cic.paso = rnd()<.5 ? "valorar" : "comentar";
        if(cic.paso==="comentar"){ cic.rub={claridad:nivel(pf.cla),dificultad:nivel(pf.dif),distractores:nivel(pf.dis),solucion:nivel(pf.sol)}; cic.tRub=t+15000; }
        DB.eventos.push({ts:cic.tResp,cod:c,tipo:"abandono",q:q.id,paso:cic.paso,extra:"sesión sin cerrar el ciclo"});
      }
      s.ciclos[q.id]=cic;
    });
    s.ultima=t;
    const n=Object.values(s.ciclos).filter(x=>x.completo).length;
    if(n>=1)s.insignias.push("primera");
    if(n>=Math.ceil(NQ()/2))s.insignias.push("mitad");
    if(n>=NQ()){s.insignias.push("final");s.terminado=true;
      s.encuesta={e1:3+Math.floor(rnd()*3),e2:3+Math.floor(rnd()*3),e3:2+Math.floor(rnd()*4),
        e4: rnd()<.5?"No entendí al principio que tenía que comentar para ganar la estrella, pensé que bastaba con responder.":"",
        e5: rnd()<.6?"Que las matrices se vean completas en el celular sin tener que desplazar hacia el lado.":"",ts:t};
      DB.eventos.push({ts:t,cod:c,tipo:"encuesta_enviada",q:"",paso:"",extra:""});
    }
    if(Object.values(s.ciclos).filter(x=>x.completo&&x.chars>=SUSTANTIVO).length>=3) s.insignias.push("voz");
    DB.sesiones[c]=s;
  }
  DB.eventos.sort((a,b)=>a.ts-b.ts);
  guardar(); rol="doc"; tab="diagnostico"; render();
  toast(CURSO.length+" estudiantes simulados");
}
function forzarCoach(){
  // enciende y apaga el asistente para todo el curso, para poder comparar las dos versiones
  DB.config.coach = DB.config.coach==="off" ? "on" : "off";
  guardar(); render();
  toast(DB.config.coach==="on"
    ? "Asistente activado para todo el curso"
    : "Asistente apagado · así se ve el flujo del brief original");
}
function modoPiloto(){
  const b=$("#demobar"); if(b) b.hidden=true;
  toast("Barra oculta. Recarga la página para recuperarla.");
}
function borrarTodo(){
  if(!confirm("Se borran todas las sesiones, respuestas y eventos guardados en este navegador. ¿Seguro?")) return;
  localStorage.removeItem(KEY); cod=null; vista="login"; DB=dbNueva(); guardar(); rol="est"; render();
  toast("Datos borrados");
}

/* ---------- registro de abandono al salir ---------- */
function marcarAbandono(){
  if(!cod||!S()) return;
  const s=S(); s.ultima=ahora();
  const abierto=Object.entries(s.ciclos||{}).find(([k,c])=>!c.completo&&c.paso!=="listo");
  if(abierto) DB.eventos.push({ts:ahora(),cod:cod,tipo:"abandono",q:abierto[0],paso:abierto[1].paso,extra:"salió sin completar el ciclo"});
  guardar();
}
window.addEventListener("pagehide",marcarAbandono);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") marcarAbandono(); });

/* ---------- alto real de la cabecera, para que la barra de progreso no se solape ---------- */
function medirHeader(){
  const h=document.querySelector("header");
  if(h) document.documentElement.style.setProperty("--hh", h.offsetHeight+"px");
}
window.addEventListener("resize",medirHeader);
window.addEventListener("load",medirHeader);

/* ------------------------------ arranque ------------------------------ */
cargar();
render();
medirHeader();
if(/[?&]piloto=1/.test(location.search)){ const b=$("#demobar"); if(b) b.hidden=true; medirHeader(); }
</script>
</body>
